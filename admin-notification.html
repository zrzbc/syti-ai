<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员控制台</title>
<style>
  body { font-family: Inter,"PingFang SC","Microsoft YaHei",sans-serif;
         background: radial-gradient(circle at 20% 10%,rgba(79,124,255,.14),transparent 30%),
                     radial-gradient(circle at 80% 90%,rgba(138,92,246,.14),transparent 30%),
                     #f7f9ff;
         min-height: 100vh; display: flex; align-items: center; justify-content: center;
         padding: 24px; margin: 0; color: #172033; }
  .box { background: #fff; border-radius: 22px; padding: 30px 28px;
         width: min(660px,100%); box-shadow: 0 24px 60px rgba(55,65,110,.14); }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.sub { color: #6f7890; font-size: 13px; margin: 0 0 22px; }
  
  .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
  .tab { flex: 1; padding: 10px; text-align: center; background: #f7f9ff; border: 1px solid #e8ebf5; border-radius: 12px; cursor: pointer; font-weight: 600; color: #6f7890; transition: .2s; }
  .tab.active { background: linear-gradient(110deg,#4f7cff,#8a5cf6); color: #fff; border-color: transparent; }
  .panel { display: none; }
  .panel.active { display: block; }

  label { display: block; font-size: 13px; font-weight: 600; color: #6f7890; margin-bottom: 6px; }
  input[type="password"], input[type="text"], input[type="date"], textarea { width: 100%; box-sizing: border-box; padding: 12px 14px;
         border: 1px solid #e8ebf5; border-radius: 12px;
         font-size: 14px; outline: none; font-family: inherit; }
  textarea { resize: vertical; min-height: 120px; line-height: 1.7; }
  input:focus, textarea:focus { border-color: #4f7cff; box-shadow: 0 0 0 3px rgba(79,124,255,.12); }
  .row { margin-bottom: 16px; }

  /* 工具栏 */
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px; background: #f7f9ff; border: 1px solid #e8ebf5; border-radius: 12px 12px 0 0; border-bottom: none; align-items: center; }
  .toolbar button { width: 34px; height: 34px; border: 1px solid #e8ebf5; background: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; color: #172033; transition: all .15s; }
  .toolbar button:hover { background: #f0f3ff; border-color: #4f7cff; }
  .toolbar .color-wrap { display: flex; align-items: center; gap: 5px; height: 34px; padding: 0 10px; border: 1px solid #e8ebf5; border-radius: 8px; background: #fff; font-size: 12px; color: #6f7890; cursor: pointer; }
  .toolbar .color-wrap input[type="color"] { width: 22px; height: 22px; border: none; padding: 0; background: none; cursor: pointer; }
  #editor { min-height: 180px; padding: 14px 16px; border: 1px solid #e8ebf5; border-radius: 0 0 12px 12px; font-size: 14px; line-height: 1.7; outline: none; background: #fff; color: #172033; max-height: 420px; overflow-y: auto; }
  #editor:empty::before { content: attr(data-placeholder); color: #b6bcc9; pointer-events: none; }

  button.publish { width: 100%; padding: 13px; border: none; border-radius: 13px; background: linear-gradient(110deg,#4f7cff,#8a5cf6); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 18px; transition: transform .2s, box-shadow .2s; }
  button.publish:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(91,100,230,.35); }
  button.publish:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .msg { margin-top: 12px; font-size: 13px; text-align: center; }
  .msg.ok { color: #22c55e; }
  .msg.err { color: #ef4444; }
</style>
</head>
<body>
  <div class="box">
    <div class="tabs">
      <div class="tab active" data-target="panel-noti">发布通知</div>
      <div class="tab" data-target="panel-lyrics">猜歌词出题</div>
    </div>

    <!-- 面板 1：发布通知 -->
    <div id="panel-noti" class="panel active">
      <h1>发布新通知</h1>
      <p class="sub">用户下次打开网页时会弹窗显示。</p>

      <div class="row">
        <label>管理员密码</label>
        <input type="password" id="pwd-noti" placeholder="请输入密码">
      </div>

      <div class="row">
        <label>通知内容</label>
        <div class="toolbar" id="toolbar">
          <button type="button" data-cmd="bold"><b>B</b></button>
          <button type="button" data-cmd="italic"><i>I</i></button>
          <button type="button" data-cmd="underline"><u>U</u></button>
          <span style="width:1px;height:20px;background:#e8ebf5;margin:0 4px;"></span>
          <label class="color-wrap">字色<input type="color" id="foreColor" value="#172033"></label>
          <label class="color-wrap">底色<input type="color" id="backColor" value="#ffffff"></label>
        </div>
        <div id="editor" contenteditable="true" data-placeholder="支持多行文本..."></div>
      </div>

      <button class="publish" id="btn-noti">发布通知</button>
      <div class="msg" id="msg-noti"></div>
    </div>

    <!-- 面板 2：猜歌词出题 -->
    <div id="panel-lyrics" class="panel">
      <h1>发布猜歌词题目</h1>
      <p class="sub">选择日期后，系统会自动拉取该日期的题目。保存时会直接覆盖旧题。</p>

      <div class="row">
        <label>管理员密码</label>
        <input type="password" id="pwd-lyrics" placeholder="请输入密码">
      </div>

      <div class="row">
        <label>发布日期（当日 0:00 生效，修改日期可读取历史）</label>
        <input type="date" id="publish-date">
      </div>

      <div class="row">
        <label>正确答案（歌名）</label>
        <input type="text" id="song-name" placeholder="例如：晴天">
      </div>

      <div class="row">
        <label>完整歌词（包含标点，系统只把汉字/字母打码）</label>
        <textarea id="original-lyrics" placeholder="故事的小黄花..."></textarea>
      </div>

      <button class="publish" id="btn-lyrics">保存并发布题目</button>
      <div class="msg" id="msg-lyrics"></div>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // === 1. Tab 切换 ===
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.target).classList.add('active');
    });
  });

  // === 2. 发布通知逻辑 ===
  const editor = document.getElementById('editor');
  document.querySelectorAll('.toolbar button[data-cmd]').forEach(btn => {
    btn.addEventListener('mousedown', e => { e.preventDefault(); document.execCommand(btn.dataset.cmd); });
  });
  document.getElementById('foreColor').addEventListener('input', e => { document.execCommand('styleWithCSS', false, true); document.execCommand('foreColor', false, e.target.value); });
  document.getElementById('backColor').addEventListener('input', e => { document.execCommand('styleWithCSS', false, true); document.execCommand('hiliteColor', false, e.target.value); });

  document.getElementById('btn-noti').addEventListener('click', async () => {
    const password = document.getElementById('pwd-noti').value;
    const content = editor.innerHTML.trim();
    const msg = document.getElementById('msg-noti');
    if (!password || !editor.innerText.trim()) {
      msg.textContent = '请填写密码和内容'; msg.className = 'msg err'; return;
    }
    
    const btn = document.getElementById('btn-noti');
    btn.disabled = true; btn.textContent = '发布中...'; msg.textContent = '';
    try {
      const res = await fetch('/api/notification/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password, content }) });
      const data = await res.json();
      if (data.success) { msg.className = 'msg ok'; msg.textContent = '发布成功'; editor.innerHTML = ''; }
      else { msg.className = 'msg err'; msg.textContent = data.error || '失败'; }
    } catch (e) { 
      msg.className = 'msg err'; 
      msg.textContent = '请求失败：' + e.message; 
      console.error(e);
    }
    finally { btn.disabled = false; btn.textContent = '发布通知'; }
  });

  // === 3. 猜歌词出题逻辑 ===
  const dateInput = document.getElementById('publish-date');
  const songNameInput = document.getElementById('song-name');
  const originalInput = document.getElementById('original-lyrics');
  const msgLyrics = document.getElementById('msg-lyrics');

  // 默认设为今天
  const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Shanghai' });
  dateInput.value = today;

  // 日期改变时拉取数据
  dateInput.addEventListener('change', async () => {
    const date = dateInput.value;
    if (!date) return;
    msgLyrics.textContent = '读取中...';
    msgLyrics.className = 'msg';
    
    try {
      const res = await fetch(`/api/game/get-lyrics?date=${date}`);
      const json = await res.json();
      if (json.success && json.data) {
        songNameInput.value = json.data.song_name;
        originalInput.value = json.data.original_lyrics;
        msgLyrics.textContent = '✅ 已加载该日期的题目，修改后可直接覆盖保存';
        msgLyrics.className = 'msg ok';
      } else {
        songNameInput.value = '';
        originalInput.value = '';
        msgLyrics.textContent = '该日期暂无题目，可创作新题';
        msgLyrics.className = 'msg';
      }
    } catch (e) {
      msgLyrics.textContent = '读取失败：' + e.message;
      msgLyrics.className = 'msg err';
    }
  });

  // 保存题目
  document.getElementById('btn-lyrics').addEventListener('click', async () => {
    const password = document.getElementById('pwd-lyrics').value;
    const publishDate = dateInput.value;
    const songName = songNameInput.value.trim();
    const original = originalInput.value.trim();
    
    if (!password || !songName || !original || !publishDate) {
      msgLyrics.textContent = '请填写所有字段（含日期）'; msgLyrics.className = 'msg err'; return;
    }

    const masked = original.replace(/[\u4e00-\u9fa5a-zA-Z0-9]/g, '■');

    const btn = document.getElementById('btn-lyrics');
    btn.disabled = true; btn.textContent = '保存中...'; msgLyrics.textContent = '';
    
    try {
      const res = await fetch('/api/game/save-lyrics', { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ password, songName, originalLyrics: original, maskedLyrics: masked, publishDate }) 
      });
      
      // 防止服务器返回非 JSON 导致解析失败
      const textData = await res.text();
      let data;
      try {
        data = JSON.parse(textData);
      } catch (err) {
        throw new Error('服务器返回了非 JSON 内容，可能是后端报错或路径错误。详情请按 F12 查看');
      }

      if (data.success) { 
        msgLyrics.className = 'msg ok'; 
        msgLyrics.textContent = `保存成功！题目将在 ${publishDate} 00:00 自动更新生效`; 
      } else { 
        msgLyrics.className = 'msg err'; 
        msgLyrics.textContent = data.error || '保存失败'; 
      }
    } catch (e) { 
      msgLyrics.className = 'msg err'; 
      msgLyrics.textContent = '操作异常：' + e.message; 
      console.error(e);
    }
    finally { 
      btn.disabled = false; 
      btn.textContent = '保存并发布题目'; 
    }
  });
});
</script>
</body>
</html>

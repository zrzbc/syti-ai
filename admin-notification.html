<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员控制台 - 通知发布</title>
<style>
  body { font-family: Inter,"PingFang SC","Microsoft YaHei",sans-serif;
         background: radial-gradient(circle at 20% 10%,rgba(79,124,255,.14),transparent 30%),
                     radial-gradient(circle at 80% 90%,rgba(138,92,246,.14),transparent 30%),
                     #f7f9ff;
         min-height: 100vh; display: flex; align-items: flex-start; justify-content: center;
         padding: 40px 24px; margin: 0; color: #172033; }
  .box { background: #fff; border-radius: 22px; padding: 30px 28px;
         width: min(720px,100%); box-shadow: 0 24px 60px rgba(55,65,110,.14); }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.sub { color: #6f7890; font-size: 13px; margin: 0 0 22px; }
  
  label { display: block; font-size: 13px; font-weight: 600; color: #6f7890; margin-bottom: 6px; }
  input[type="password"] { width: 100%; box-sizing: border-box; padding: 12px 14px;
         border: 1px solid #e8ebf5; border-radius: 12px;
         font-size: 14px; outline: none; font-family: inherit; }
  input[type="password"]:focus { border-color: #4f7cff; box-shadow: 0 0 0 3px rgba(79,124,255,.12); }
  .row { margin-bottom: 16px; }

  /* 工具栏 */
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px; background: #f7f9ff; border: 1px solid #e8ebf5; border-radius: 12px 12px 0 0; border-bottom: none; align-items: center; }
  .toolbar button { width: 34px; height: 34px; border: 1px solid #e8ebf5; background: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; color: #172033; transition: all .15s; }
  .toolbar button:hover { background: #f0f3ff; border-color: #4f7cff; }
  .toolbar button:active { background: #4f7cff; color: #fff; border-color: #4f7cff; }
  .toolbar select { height: 34px; padding: 0 8px; border: 1px solid #e8ebf5; border-radius: 8px; background: #fff; font-size: 13px; cursor: pointer; outline: none; color: #172033; font-family: inherit; }
  .toolbar select:hover { border-color: #4f7cff; }
  .toolbar .color-wrap { display: flex; align-items: center; gap: 5px; height: 34px; padding: 0 10px; border: 1px solid #e8ebf5; border-radius: 8px; background: #fff; font-size: 12px; color: #6f7890; cursor: pointer; user-select: none; }
  .toolbar .color-wrap:hover { border-color: #4f7cff; }
  .toolbar .color-wrap input[type="color"] { width: 22px; height: 22px; border: none; padding: 0; background: none; cursor: pointer; }
  .toolbar .divider { width: 1px; height: 20px; background: #e8ebf5; margin: 0 2px; }

  #editor { min-height: 180px; padding: 14px 16px; border: 1px solid #e8ebf5; border-radius: 0 0 12px 12px; font-size: 14px; line-height: 1.7; outline: none; background: #fff; color: #172033; overflow-y: auto; max-height: 420px; }
  #editor:focus { border-color: #4f7cff; box-shadow: 0 0 0 3px rgba(79,124,255,.12); }
  #editor:empty::before { content: attr(data-placeholder); color: #b6bcc9; pointer-events: none; }

  button.publish { width: 100%; padding: 13px; border: none; border-radius: 13px; background: linear-gradient(110deg,#4f7cff,#8a5cf6); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 18px; transition: transform .2s, box-shadow .2s; }
  button.publish:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(91,100,230,.35); }
  button.publish:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .msg { margin-top: 12px; font-size: 13px; text-align: center; }
  .msg.ok { color: #22c55e; }
  .msg.err { color: #ef4444; }

  /* 历史记录区 */
  .history-section { margin-top: 36px; border-top: 2px dashed #e8ebf5; padding-top: 24px; }
  .history-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: #172033; display: flex; align-items: center; justify-content: space-between; }
  .history-list { display: flex; flex-direction: column; gap: 12px; }
  .history-item { border: 1px solid #e8ebf5; border-radius: 12px; padding: 14px 16px; background: #fafbfc; transition: .2s; }
  .history-item:hover { box-shadow: 0 4px 12px rgba(0,0,0,.04); border-color: #d1d9e6; }
  .history-header { display: flex; justify-content: space-between; font-size: 12px; color: #9ca3af; margin-bottom: 8px; }
  .history-content { font-size: 13px; color: #4b5563; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 12px; }
  .history-actions { display: flex; gap: 8px; }
  .history-actions button { padding: 6px 12px; font-size: 12px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; transition: .15s; font-weight: 600; }
  .btn-edit { background: #eef2ff; color: #4f7cff; border-color: #dbe4ff; }
  .btn-edit:hover { background: #dbe4ff; }
  .btn-delete { background: #fff0f3; color: #ef4444; border-color: #fce1e6; }
  .btn-delete:hover { background: #fce1e6; }
  .empty-history { text-align: center; color: #9ca3af; font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>
  <div class="box">
    <h1>发布新通知</h1>
    <p class="sub">用户下次打开网页时会弹窗显示。每次发布的内容都会保存在下方历史记录中。</p>

    <div class="row">
      <label>管理员密码</label>
      <input type="password" id="pwd" placeholder="请输入密码">
    </div>

    <div class="row">
      <label>通知内容（先选中文字，再点样式）</label>
      <div class="toolbar" id="toolbar">
        <button type="button" data-cmd="bold" title="加粗"><b>B</b></button>
        <button type="button" data-cmd="italic" title="斜体"><i>I</i></button>
        <button type="button" data-cmd="underline" title="下划线"><u>U</u></button>
        <button type="button" data-cmd="strikeThrough" title="删除线"><s>S</s></button>

        <span class="divider"></span>

        <select id="fontFamily" title="字体">
          <option value="">默认字体</option>
          <option value="Microsoft YaHei">微软雅黑</option>
          <option value="SimHei">黑体</option>
          <option value="KaiTi">楷体</option>
          <option value="SimSun">宋体</option>
        </select>

        <select id="fontSize" title="字号">
          <option value="">默认字号</option>
          <option value="12px">12px 小</option>
          <option value="14px">14px 正常</option>
          <option value="16px">16px 中</option>
          <option value="18px">18px 大</option>
          <option value="22px">22px 特大</option>
          <option value="28px">28px 超大</option>
        </select>

        <label class="color-wrap" title="文字颜色">
          字色<input type="color" id="foreColor" value="#172033">
        </label>
        <label class="color-wrap" title="背景颜色">
          底色<input type="color" id="backColor" value="#ffffff">
        </label>

        <span class="divider"></span>

        <button type="button" id="insertLink" title="插入超链接（先选中文字）" style="font-size:12px;width:auto;padding:0 8px;">链接</button>
        <span class="divider"></span>
        <button type="button" id="clearBg" title="清除背景色" style="font-size:12px;width:auto;padding:0 8px;">清底</button>
        <button type="button" id="clearFormat" title="清除所有格式" style="font-size:12px;width:auto;padding:0 8px;">清格式</button>
      </div>
      <div id="editor" contenteditable="true" data-placeholder="支持多行文本，可选中后设置字体 / 颜色 / 加粗等"></div>
    </div>

    <button class="publish" id="btn">发布通知</button>
    <div class="msg" id="msg"></div>

    <!-- 历史记录区域 -->
    <div class="history-section">
      <div class="history-title">
        <span>历史发布记录 (本地)</span>
        <button id="clearHistoryBtn" style="background:none; border:none; color:#9ca3af; font-size:12px; cursor:pointer; text-decoration:underline;">清空全部</button>
      </div>
      <div class="history-list" id="historyList">
        <!-- 动态渲染 -->
      </div>
    </div>
  </div>

<script>
(function () {
  const editor = document.getElementById('editor');
  const foreColorInput = document.getElementById('foreColor');
  const backColorInput = document.getElementById('backColor');
  const fontFamilySel = document.getElementById('fontFamily');
  const fontSizeSel = document.getElementById('fontSize');
  const historyList = document.getElementById('historyList');

  // ===== 持续保存选区（关键：每次选区变化都保存） =====
  let savedRange = null;
  function saveRange() {
    const sel = window.getSelection();
    if (sel.rangeCount && editor.contains(sel.anchorNode)) {
      savedRange = sel.getRangeAt(0).cloneRange();
    }
  }
  document.addEventListener('selectionchange', saveRange);
  editor.addEventListener('keyup', saveRange);
  editor.addEventListener('mouseup', saveRange);
  editor.addEventListener('input', saveRange);

  // ===== 恢复选区 =====
  function restoreRange() {
    if (!savedRange) return false;
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
    return true;
  }

  // ===== 执行 execCommand =====
  function exec(cmd, val) {
    editor.focus();
    restoreRange();
    document.execCommand('styleWithCSS', false, true);
    document.execCommand(cmd, false, val || null);
    saveRange();
  }

  // ===== 所有工具栏按钮：mousedown 阻止默认行为，避免选区丢失 =====
  document.querySelectorAll('.toolbar button[data-cmd]').forEach(btn => {
    btn.addEventListener('mousedown', e => {
      e.preventDefault();
      exec(btn.dataset.cmd);
    });
  });

  document.getElementById('clearBg').addEventListener('mousedown', e => {
    e.preventDefault();
    exec('hiliteColor', 'transparent');
  });

  document.getElementById('clearFormat').addEventListener('mousedown', e => {
    e.preventDefault();
    exec('removeFormat');
  });

  // ===== 字体 =====
  fontFamilySel.addEventListener('change', () => {
    if (!fontFamilySel.value) return;
    exec('fontName', fontFamilySel.value);
    fontFamilySel.value = '';
  });

  // ===== 字号（自定义包裹 span） =====
  function applyFontSize(px) {
    editor.focus();
    if (!restoreRange()) return;
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    if (range.collapsed) return;

    const span = document.createElement('span');
    span.style.fontSize = px;

    try {
      range.surroundContents(span);
    } catch (e) {
      const frag = range.extractContents();
      frag.querySelectorAll && frag.querySelectorAll('span').forEach(s => {
        if (s.style && s.style.fontSize) s.style.fontSize = '';
      });
      span.appendChild(frag);
      range.insertNode(span);
    }

    sel.removeAllRanges();
    const newRange = document.createRange();
    newRange.selectNodeContents(span);
    sel.addRange(newRange);
    saveRange();
  }

  fontSizeSel.addEventListener('change', () => {
    if (!fontSizeSel.value) return;
    applyFontSize(fontSizeSel.value);
    fontSizeSel.value = '';
  });

  // ===== 文字颜色 =====
  function applyForeColor(color) {
    editor.focus();
    restoreRange();
    document.execCommand('styleWithCSS', false, true);
    document.execCommand('foreColor', false, color);
    saveRange();
  }
  foreColorInput.addEventListener('change', () => applyForeColor(foreColorInput.value));
  foreColorInput.addEventListener('input', () => applyForeColor(foreColorInput.value));

  // ===== 背景色 =====
  function applyBackColor(color) {
    editor.focus();
    restoreRange();
    document.execCommand('styleWithCSS', false, true);
    document.execCommand('hiliteColor', false, color);
    saveRange();
  }
  backColorInput.addEventListener('change', () => applyBackColor(backColorInput.value));
  backColorInput.addEventListener('input', () => applyBackColor(backColorInput.value));

  // ===== 超链接：先选中文字，再输入网址 =====
  document.getElementById('insertLink').addEventListener('mousedown', (e) => {
    e.preventDefault();
    insertLink();
  });

  function insertLink() {
    editor.focus();
    if (!restoreRange()) {
      alert('请先在编辑区选中要加链接的文字');
      return;
    }
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    if (range.collapsed) {
      alert('请先选中要加链接的文字');
      return;
    }

    const anchorNode = range.startContainer;
    const el = anchorNode.nodeType === 1 ? anchorNode : anchorNode.parentElement;
    const closestA = el ? el.closest('a') : null;
    const currentHref = (closestA && editor.contains(closestA)) ? (closestA.getAttribute('href') || '') : '';

    const url = prompt('请输入链接地址（选中的文字将变成超链接）：', currentHref || 'https://');
    if (url === null) return;
    const trimmed = url.trim();
    if (!trimmed) return;

    let finalUrl = trimmed;
    if (!/^(https?:\/\/|mailto:)/i.test(finalUrl)) {
      finalUrl = 'https://' + finalUrl;
    }

    document.execCommand('styleWithCSS', false, true);

    if (closestA && editor.contains(closestA)) {
      closestA.setAttribute('href', finalUrl);
      closestA.setAttribute('target', '_blank');
      closestA.setAttribute('rel', 'noopener noreferrer');
      closestA.style.color = '#4f7cff';
      closestA.style.textDecoration = 'underline';
    } else {
      document.execCommand('createLink', false, finalUrl);
      editor.querySelectorAll('a').forEach(a => {
        if (a.getAttribute('href') === finalUrl && !a.dataset.linkFixed) {
          a.setAttribute('target', '_blank');
          a.setAttribute('rel', 'noopener noreferrer');
          a.style.color = '#4f7cff';
          a.style.textDecoration = 'underline';
          a.dataset.linkFixed = '1';
        }
      });
    }

    saveRange();
    editor.focus();
  }

  // ==========================================
  // ===== 历史记录逻辑 =====
  // ==========================================
  let historyData = [];
  try {
    historyData = JSON.parse(localStorage.getItem('zrzbc_notification_history') || '[]');
  } catch(e) { historyData = []; }

  function renderHistory() {
    if (!historyData || historyData.length === 0) {
      historyList.innerHTML = '<div class="empty-history">暂无历史记录</div>';
      return;
    }
    historyList.innerHTML = '';
    historyData.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'history-item';
      div.innerHTML = `
        <div class="history-header">
          <span>发布于：${item.time}</span>
          <span>ID: ${item.id}</span>
        </div>
        <div class="history-content">${item.content.replace(/<[^>]+>/g, '') || '[图文内容]'}</div>
        <div class="history-actions">
          <button class="btn-edit" data-index="${index}">载入编辑</button>
          <button class="btn-delete" data-index="${index}">删除</button>
        </div>
      `;
      historyList.appendChild(div);
    });

    // 绑定编辑按钮
    document.querySelectorAll('.btn-edit').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const index = e.target.dataset.index;
        editor.innerHTML = historyData[index].content;
        const msgEl = document.getElementById('msg');
        msgEl.className = 'msg';
        msgEl.textContent = '已载入历史记录，修改后可重新发布';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    // 绑定删除按钮
    document.querySelectorAll('.btn-delete').forEach(btn => {
      btn.addEventListener('click', (e) => {
        if (!confirm('确定要删除这条历史记录吗？')) return;
        const index = e.target.dataset.index;
        historyData.splice(index, 1);
        localStorage.setItem('zrzbc_notification_history', JSON.stringify(historyData));
        renderHistory();
      });
    });
  }

  renderHistory();

  document.getElementById('clearHistoryBtn').addEventListener('click', () => {
    if (!confirm('确定要清空所有历史记录吗？')) return;
    historyData = [];
    localStorage.setItem('zrzbc_notification_history', '[]');
    renderHistory();
  });

  // ==========================================
  // ===== 发布 =====
  // ==========================================
  document.getElementById('btn').addEventListener('click', async () => {
    const password = document.getElementById('pwd').value;
    const content = editor.innerHTML.trim();
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');

    const plain = editor.innerText.trim();
    if (!password || !plain) {
      msg.className = 'msg err';
      msg.textContent = '请填写密码和内容';
      return;
    }

    btn.disabled = true; btn.textContent = '发布中...';
    msg.textContent = '';
    try {
      const res = await fetch('/api/notification/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, content })
      });
      const data = await res.json();
      if (data.success) {
        msg.className = 'msg ok';
        msg.textContent = '✅ 发布成功！用户下次打开页面就会看到。';
        
        // 存入本地历史
        const now = new Date();
        const timeStr = now.toLocaleString('zh-CN', { hour12: false });
        historyData.unshift({
          id: Date.now().toString().slice(-6),
          time: timeStr,
          content: content
        });
        if (historyData.length > 20) historyData.length = 20;
        localStorage.setItem('zrzbc_notification_history', JSON.stringify(historyData));
        renderHistory();

        editor.innerHTML = '';
        savedRange = null;
      } else {
        msg.className = 'msg err';
        msg.textContent = data.error || '发布失败';
      }
    } catch (e) {
      msg.className = 'msg err';
      msg.textContent = '网络错误';
    } finally {
      btn.disabled = false; btn.textContent = '发布通知';
    }
  });
})();
</script>
</body>
</html>

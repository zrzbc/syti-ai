<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发布通知 · 管理</title>
<style>
  body { font-family: Inter,"PingFang SC","Microsoft YaHei",sans-serif;
         background: radial-gradient(circle at 20% 10%,rgba(79,124,255,.14),transparent 30%),
                     radial-gradient(circle at 80% 90%,rgba(138,92,246,.14),transparent 30%),
                     #f7f9ff;
         min-height: 100vh; display: flex; align-items: center; justify-content: center;
         padding: 24px; margin: 0; color: #172033; }
  .box { background: #fff; border-radius: 22px; padding: 30px 28px;
         width: min(660px,100%); box-shadow: 0 24px 60px rgba(55,65,110,.14); }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.sub { color: #6f7890; font-size: 13px; margin: 0 0 22px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #6f7890; margin-bottom: 6px; }
  input[type="password"] { width: 100%; box-sizing: border-box; padding: 12px 14px;
         border: 1px solid #e8ebf5; border-radius: 12px;
         font-size: 14px; outline: none; font-family: inherit; }
  input[type="password"]:focus { border-color: #4f7cff; box-shadow: 0 0 0 3px rgba(79,124,255,.12); }
  .row { margin-bottom: 16px; }

  /* 工具栏 */
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 8px 10px;
    background: #f7f9ff;
    border: 1px solid #e8ebf5;
    border-radius: 12px 12px 0 0;
    border-bottom: none;
    align-items: center;
  }
  .toolbar button {
    width: 34px; height: 34px;
    border: 1px solid #e8ebf5; background: #fff;
    border-radius: 8px; cursor: pointer;
    font-size: 14px; display: flex; align-items: center; justify-content: center;
    color: #172033; transition: all .15s;
    user-select: none;
  }
  .toolbar button:hover { background: #f0f3ff; border-color: #4f7cff; }
  .toolbar button:active { background: #4f7cff; color: #fff; border-color: #4f7cff; }
  .toolbar select {
    height: 34px; padding: 0 8px; border: 1px solid #e8ebf5;
    border-radius: 8px; background: #fff; font-size: 13px;
    cursor: pointer; outline: none; color: #172033;
    font-family: inherit;
  }
  .toolbar select:hover { border-color: #4f7cff; }
  .toolbar .color-wrap {
    display: flex; align-items: center; gap: 5px;
    height: 34px; padding: 0 10px;
    border: 1px solid #e8ebf5; border-radius: 8px; background: #fff;
    font-size: 12px; color: #6f7890; cursor: pointer;
    user-select: none;
  }
  .toolbar .color-wrap:hover { border-color: #4f7cff; }
  .toolbar .color-wrap input[type="color"] {
    width: 22px; height: 22px; border: none; padding: 0;
    background: none; cursor: pointer;
  }
  .toolbar .divider { width: 1px; height: 20px; background: #e8ebf5; margin: 0 2px; }

  /* 编辑区 */
  #editor {
    min-height: 180px;
    padding: 14px 16px;
    border: 1px solid #e8ebf5;
    border-radius: 0 0 12px 12px;
    font-size: 14px;
    line-height: 1.7;
    outline: none;
    background: #fff;
    color: #172033;
    overflow-y: auto;
    max-height: 420px;
  }
  #editor:focus { border-color: #4f7cff; box-shadow: 0 0 0 3px rgba(79,124,255,.12); }
  #editor:empty::before {
    content: attr(data-placeholder);
    color: #b6bcc9;
    pointer-events: none;
  }

  button.publish {
    width: 100%; padding: 13px; border: none; border-radius: 13px;
    background: linear-gradient(110deg,#4f7cff,#8a5cf6); color: #fff;
    font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 18px;
    transition: transform .2s, box-shadow .2s;
  }
  button.publish:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(91,100,230,.35); }
  button.publish:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .msg { margin-top: 12px; font-size: 13px; text-align: center; }
  .msg.ok { color: #22c55e; }
  .msg.err { color: #ef4444; }
</style>
</head>
<body>
  <div class="box">
    <h1>📢 发布新通知</h1>
    <p class="sub">用户下次打开网页时会弹窗显示，关闭后不再重复提醒。</p>

    <div class="row">
      <label>管理员密码</label>
      <input type="password" id="pwd" placeholder="请输入密码">
    </div>

    <div class="row">
      <label>通知内容（先选中文字，再点样式）</label>
      <div class="toolbar" id="toolbar">
        <button type="button" data-cmd="bold" title="加粗"><b>B</b></button>
        <button type="button" data-cmd="italic" title="斜体"><i>I</i></button>
        <button type="button" data-cmd="underline" title="下划线"><u>U</u></button>
        <button type="button" data-cmd="strikeThrough" title="删除线"><s>S</s></button>

        <span class="divider"></span>

        <select id="fontFamily" title="字体">
          <option value="">默认字体</option>
          <option value="Microsoft YaHei">微软雅黑</option>
          <option value="SimHei">黑体</option>
          <option value="KaiTi">楷体</option>
          <option value="SimSun">宋体</option>
        </select>

        <select id="fontSize" title="字号">
          <option value="">默认字号</option>
          <option value="12px">12px 小</option>
          <option value="14px">14px 正常</option>
          <option value="16px">16px 中</option>
          <option value="18px">18px 大</option>
          <option value="22px">22px 特大</option>
          <option value="28px">28px 超大</option>
        </select>

        <label class="color-wrap" title="文字颜色">
          字色<input type="color" id="foreColor" value="#172033">
        </label>
        <label class="color-wrap" title="背景颜色">
          底色<input type="color" id="backColor" value="#ffffff">
        </label>

        <span class="divider"></span>

        <button type="button" id="clearBg" title="清除背景色" style="font-size:12px;">清底</button>
        <button type="button" id="clearFormat" title="清除所有格式" style="font-size:12px;">清格式</button>
      </div>
      <div id="editor" contenteditable="true" data-placeholder="支持多行文本，可选中后设置字体 / 颜色 / 加粗等"></div>
    </div>

    <button class="publish" id="btn">发布通知</button>
    <div class="msg" id="msg"></div>
  </div>

<script>
(function () {
  const editor = document.getElementById('editor');
  const foreColorInput = document.getElementById('foreColor');
  const backColorInput = document.getElementById('backColor');
  const fontFamilySel = document.getElementById('fontFamily');
  const fontSizeSel = document.getElementById('fontSize');

  // ===== 持续保存选区（关键：每次选区变化都保存） =====
  let savedRange = null;
  function saveRange() {
    const sel = window.getSelection();
    if (sel.rangeCount && editor.contains(sel.anchorNode)) {
      savedRange = sel.getRangeAt(0).cloneRange();
    }
  }
  document.addEventListener('selectionchange', saveRange);
  editor.addEventListener('keyup', saveRange);
  editor.addEventListener('mouseup', saveRange);
  editor.addEventListener('input', saveRange);

  // ===== 恢复选区 =====
  function restoreRange() {
    if (!savedRange) return false;
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
    return true;
  }

  // ===== 执行 execCommand =====
  function exec(cmd, val) {
    editor.focus();
    restoreRange();
    document.execCommand('styleWithCSS', false, true);
    document.execCommand(cmd, false, val || null);
    saveRange();
  }

  // ===== 所有工具栏按钮：mousedown 阻止默认行为，避免选区丢失 =====
  document.querySelectorAll('.toolbar button[data-cmd]').forEach(btn => {
    btn.addEventListener('mousedown', e => {
      e.preventDefault();
      exec(btn.dataset.cmd);
    });
  });

  document.getElementById('clearBg').addEventListener('mousedown', e => {
    e.preventDefault();
    exec('hiliteColor', 'transparent');
  });

  document.getElementById('clearFormat').addEventListener('mousedown', e => {
    e.preventDefault();
    exec('removeFormat');
  });

  // ===== 字体 =====
  fontFamilySel.addEventListener('change', () => {
    if (!fontFamilySel.value) return;
    exec('fontName', fontFamilySel.value);
    fontFamilySel.value = '';
  });

  // ===== 字号（自定义包裹 span） =====
  function applyFontSize(px) {
    editor.focus();
    if (!restoreRange()) return;
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    if (range.collapsed) return;

    // 先清除选区内已有的 font-size，避免嵌套
    const span = document.createElement('span');
    span.style.fontSize = px;

    try {
      range.surroundContents(span);
    } catch (e) {
      const frag = range.extractContents();
      // 清掉内部可能存在的 font-size 嵌套
      frag.querySelectorAll && frag.querySelectorAll('span').forEach(s => {
        if (s.style && s.style.fontSize) s.style.fontSize = '';
      });
      span.appendChild(frag);
      range.insertNode(span);
    }

    // 重新选中新内容
    sel.removeAllRanges();
    const newRange = document.createRange();
    newRange.selectNodeContents(span);
    sel.addRange(newRange);
    saveRange();
  }

  fontSizeSel.addEventListener('change', () => {
    if (!fontSizeSel.value) return;
    applyFontSize(fontSizeSel.value);
    fontSizeSel.value = '';
  });

  // ===== 文字颜色 =====
  function applyForeColor(color) {
    editor.focus();
    restoreRange();
    document.execCommand('styleWithCSS', false, true);
    document.execCommand('foreColor', false, color);
    saveRange();
  }
  foreColorInput.addEventListener('change', () => applyForeColor(foreColorInput.value));
  foreColorInput.addEventListener('input', () => applyForeColor(foreColorInput.value));

  // ===== 背景色 =====
  function applyBackColor(color) {
    editor.focus();
    restoreRange();
    document.execCommand('styleWithCSS', false, true);
    document.execCommand('hiliteColor', false, color);
    saveRange();
  }
  backColorInput.addEventListener('change', () => applyBackColor(backColorInput.value));
  backColorInput.addEventListener('input', () => applyBackColor(backColorInput.value));

  // ===== 发布 =====
  document.getElementById('btn').addEventListener('click', async () => {
    const password = document.getElementById('pwd').value;
    const content = editor.innerHTML.trim();
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');

    const plain = editor.innerText.trim();
    if (!password || !plain) {
      msg.className = 'msg err';
      msg.textContent = '请填写密码和内容';
      return;
    }

    btn.disabled = true; btn.textContent = '发布中...';
    msg.textContent = '';
    try {
      const res = await fetch('/api/notification/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, content })
      });
      const data = await res.json();
      if (data.success) {
        msg.className = 'msg ok';
        msg.textContent = '✅ 发布成功！用户下次打开页面就会看到。';
        editor.innerHTML = '';
        savedRange = null;
      } else {
        msg.className = 'msg err';
        msg.textContent = data.error || '发布失败';
      }
    } catch (e) {
      msg.className = 'msg err';
      msg.textContent = '网络错误';
    } finally {
      btn.disabled = false; btn.textContent = '发布通知';
    }
  });
})();
</script>
</body>
</html>

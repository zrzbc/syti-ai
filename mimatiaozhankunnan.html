<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>请创建一个专属密码</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fcf7f2;
            background-image: radial-gradient(circle at 20% 30%, rgba(243, 213, 181, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(243, 213, 181, 0.25) 0%, transparent 50%);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }
        .game-master {
            width: 100%;
            max-width: 720px;
            background: #ffffff;
            border-radius: 36px;
            padding: 32px 36px 28px;
            box-shadow: 0 20px 48px rgba(140, 100, 50, 0.12), 0 4px 16px rgba(0,0,0,0.04);
            border: 1px solid rgba(220, 190, 150, 0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
            transform: scale(1.02);
            transform-origin: center center;
        }
        @media (max-width: 600px) {
            .game-master {
                transform: scale(1);
                padding: 20px 14px 16px;
                border-radius: 24px;
                gap: 14px;
            }
        }
        .title-area {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .title-icon { font-size: 2rem; line-height: 1; }
        .title-text { font-size: 1.3rem; font-weight: 600; color: #4b3621; letter-spacing: -0.3px; }
        .title-hint { font-size: 0.78rem; font-weight: 400; color: #9b8c7c; margin-top: 2px; }
        .timer-box {
            margin-left: auto;
            background: #f9f2e9;
            border-radius: 100px;
            padding: 8px 18px;
            font-size: 0.9rem;
            font-weight: 550;
            color: #7b6e5e;
            font-variant-numeric: tabular-nums;
            font-family: 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
            opacity: 0;
            transition: opacity 0.4s ease;
            white-space: nowrap;
            border: 1px solid #e4d5c2;
        }
        .timer-box.visible { opacity: 1; }
        .input-wrapper { position: relative; }
        .input-field {
            width: 100%;
            height: 58px;
            border: 2px solid #e8d7c0;
            border-radius: 20px;
            padding: 0 20px;
            font-size: 1.2rem;
            font-family: 'JetBrains Mono', 'SF Mono', 'Consolas', 'Fira Code', monospace;
            letter-spacing: 0.05em;
            color: #2e241a;
            background: #fefdfb;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .input-field:focus {
            border-color: #cfb594;
            box-shadow: 0 0 0 6px rgba(207, 181, 148, 0.13);
            background: #ffffff;
        }
        .input-field.win-glow {
            border-color: #27ae60 !important;
            box-shadow: 0 0 0 10px rgba(39, 174, 96, 0.12) !important;
            background: #f6fdf8 !important;
            color: #1a4d2a;
            transition: all 0.5s ease;
        }
        .char-badge {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
            font-weight: 600;
            color: #c4b29a;
            pointer-events: none;
            font-family: 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
            transition: color 0.2s;
        }
        .char-badge.exact { color: #27ae60; }
        .prompt-stage {
            position: relative;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .main-card-container {
            position: relative;
            overflow: hidden;
            border-radius: 18px;
        }
        .card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-radius: 18px;
            background: #fefdfb;
            border: 2px solid #e8d7c0;
            min-height: 60px;
            will-change: transform, opacity;
            position: relative;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }
        .card.active {
            border-color: #d4b896;
            background: #fdf8f3;
            box-shadow: 0 4px 14px rgba(180, 140, 90, 0.08);
        }
        .card.error-flash {
            animation: flashRed 0.55s ease;
        }
        .card.slide-out {
            animation: slideOutRight 0.38s cubic-bezier(0.55, 0, 0.1, 1) forwards;
        }
        .card.bounce-in {
            animation: bounceInUp 0.48s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .card.ghost {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }
        .card-index {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e8d7c0;
            color: #5e4630;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-family: 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
            transition: background 0.2s, color 0.2s;
        }
        .card.active .card-index {
            background: #cfb594;
            color: #ffffff;
            box-shadow: 0 3px 10px rgba(180, 130, 70, 0.3);
        }
        .card-text {
            flex: 1;
            font-size: 0.95rem;
            font-weight: 500;
            color: #3e3024;
            line-height: 1.4;
            letter-spacing: 0.01em;
            word-break: break-word;
        }
        .card-icon {
            flex-shrink: 0;
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .card-icon.show { opacity: 1; }
        .card-icon.pass { color: #27ae60; }
        .card-icon.fail { color: #e74c3c; }
        .error-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
        }
        .error-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 16px;
            background: #fff5f4;
            border: 2px solid #e74c3c;
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            will-change: transform, opacity;
        }
        .error-card.slide-out-error {
            animation: slideOutRightError 0.32s cubic-bezier(0.55, 0, 0.1, 1) forwards;
        }
        .error-card .card-index {
            background: #e74c3c;
            color: white;
        }
        .error-card .card-text {
            color: #5b1a1a;
            font-weight: 500;
        }
        @keyframes flashRed {
            0%,100% { border-color:#e8d7c0; box-shadow:none; background:#fefdfb; }
            15% { border-color:#e74c3c; box-shadow:0 0 0 6px rgba(231,76,60,0.15); background:#fff5f4; }
            30% { border-color:#e8d7c0; box-shadow:none; background:#fefdfb; }
            45% { border-color:#e74c3c; box-shadow:0 0 0 6px rgba(231,76,60,0.15); background:#fff5f4; }
            60% { border-color:#e8d7c0; box-shadow:none; background:#fefdfb; }
            75% { border-color:#e74c3c; box-shadow:0 0 0 4px rgba(231,76,60,0.1); }
        }
        @keyframes slideOutRight {
            0%{ transform:translateX(0); opacity:1; }
            100%{ transform:translateX(130%); opacity:0; }
        }
        @keyframes bounceInUp {
            0%{ transform:translateY(55px); opacity:0; }
            65%{ transform:translateY(-6px); opacity:1; }
            85%{ transform:translateY(2px); }
            100%{ transform:translateY(0); opacity:1; }
        }
        @keyframes popIn {
            0%{ transform:translateY(-18px); opacity:0; }
            60%{ transform:translateY(3px); opacity:1; }
            100%{ transform:translateY(0); opacity:1; }
        }
        @keyframes slideOutRightError {
            0%{ transform:translateX(0); opacity:1; max-height:70px; margin-bottom:10px; }
            100%{ transform:translateX(140%); opacity:0; max-height:0; margin-bottom:0; padding-top:0; padding-bottom:0; border-width:0; }
        }
        .emoji-rain {
            position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999; overflow:hidden;
        }
        .rain-drop {
            position: absolute; font-size:2.2rem; animation:fall linear forwards; pointer-events:none; user-select:none;
        }
        @keyframes fall {
            0%{ transform:translateY(-120px) rotate(0deg); opacity:1; }
            70%{ opacity:1; }
            100%{ transform:translateY(105vh) rotate(540deg); opacity:0; }
        }
        .victory-toast {
            position: fixed; top:24px; left:50%; transform:translateX(-50%);
            background:#fff; border:2px solid #27ae60; border-radius:20px; padding:12px 28px;
            z-index:10000; font-weight:600; color:#1a4d2a; font-size:1rem;
            box-shadow:0 12px 32px rgba(39,174,96,0.18);
            animation:toastPop 0.5s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
            display:flex; align-items:center; gap:8px; pointer-events:none;
        }
        @keyframes toastPop {
            0%{ transform:translateX(-50%) translateY(-36px); opacity:0; }
            100%{ transform:translateX(-50%) translateY(0); opacity:1; }
        }
        .time-highlight {
            font-family: 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
            font-weight: 700; color:#27ae60; font-size:1.15rem;
        }
    </style>
</head>
<body>
<div class="game-master" id="gameMaster">
    <div class="title-area">
        <div>
            <div class="title-text">请创建一个专属密码！</div>
        </div>
        <div class="timer-box" id="timerBox">⏱ 00:00</div>
    </div>
    <div class="input-wrapper">
        <input type="text" class="input-field" id="passwordInput" placeholder="在此输入..." autocomplete="off" spellcheck="false" maxlength="40">
        <span class="char-badge" id="charBadge">0</span>
    </div>
    <div class="prompt-stage" id="promptStage">
        <div class="main-card-container" id="mainCardContainer">
            <div class="card active bounce-in" id="mainCard">
                <span class="card-index" id="mainCardIndex">1</span>
                <span class="card-text" id="mainCardText">密码需要包含英文字母和数字。</span>
                <span class="card-icon" id="mainCardIcon"></span>
            </div>
        </div>
        <div class="error-stack" id="errorStack"></div>
    </div>
</div>
<div class="emoji-rain" id="emojiRain"></div>
<script>
    (function() {
        const passwordInput = document.getElementById('passwordInput');
        const charBadge = document.getElementById('charBadge');
        const timerBox = document.getElementById('timerBox');
        const mainCard = document.getElementById('mainCard');
        const mainCardIndex = document.getElementById('mainCardIndex');
        const mainCardText = document.getElementById('mainCardText');
        const mainCardIcon = document.getElementById('mainCardIcon');
        const errorStack = document.getElementById('errorStack');
        const emojiRain = document.getElementById('emojiRain');

        const CONDITION_TEXTS = [
            '密码需要包含英文字母和数字。',
            '密码需要包含7个数字。',
            '密码需要包含3个及以上的特殊符号。',
            '密码里的所有数字之和等于30。',
            '密码里的所有小写字母需要紧挨着排列。',
            '密码里的第3位和第9位字符为数字。',
            '密码需要包含单词password。',
            '密码里的第1位和第10位字符为大写字母。',
            '密码里的所有大写字母均为X。',
            '密码长度为33个字符。',
            '密码里的第33位字符为大写字母。',
            '密码需要包含一个等式，并出现加减乘除任意符号。',
            '密码需要包含5个从小到大连续排列的小写字母。',
            '密码里的所有大写字母在罗马数字里的之和为40。',
            '密码需要包含可以被4整除的数字。',
            '密码需要包含一个日语片假名和两个韩语辅音。',
            '密码里的数字不能被3整除。',
            '密码需要包含2个及以上的质数。',
            '密码需要包含一个明代年份。',
            '密码里的第12位和第14位字符可以组合成一种化学元素。'
        ];

        const TWO_LETTER_ELEMENTS = new Set([
            'he','li','be','ne','na','mg','al','si','cl','ar','ca','sc','ti','cr','mn','fe','co','ni','cu','zn',
            'ga','ge','as','se','br','kr','rb','sr','y','zr','nb','mo','tc','ru','rh','pd','ag','cd','in','sn',
            'sb','te','xe','cs','ba','la','ce','pr','nd','pm','sm','eu','gd','tb','dy','ho','er','tm','yb','lu',
            'hf','ta','re','os','ir','pt','au','hg','tl','pb','bi','po','at','rn','fr','ra','ac','th','pa','u',
            'np','pu','am','cm','bk','cf','es','fm','md','no','lr','rf','db','sg','bh','hs','mt','ds','rg','cn',
            'nh','fl','mc','lv','ts','og'
        ]);

        const ROMAN_VALUES = { 'I':1, 'V':5, 'X':10, 'L':50, 'C':100, 'D':500, 'M':1000 };
        const MING_YEARS = new Set(Array.from({length:277}, (_,i)=> (1368+i).toString()));

        let currentIndex = 0;
        let gameWon = false;
        let isAnimating = false;
        let firstInputTime = null;
        let timerInterval = null;
        let errorElementsMap = new Map();

        function getDigits(pwd) { return (pwd.match(/\d/g) || []).map(Number); }
        function getLetters(pwd) { return (pwd.match(/[a-zA-Z]/g) || []); }

        function checkCondition(index, pwd) {
            const digits = getDigits(pwd);
            const letters = getLetters(pwd);
            switch (index) {
                case 0: return /[a-zA-Z]/.test(pwd) && /\d/.test(pwd);
                case 1: return digits.length === 7;
                case 2: return (pwd.match(/[\p{P}\p{S}]/gu) || []).length >= 3;
                case 3: return digits.length > 0 && digits.reduce((a,b)=>a+b,0) === 30;
                case 4: {
                    const lowerPositions = [];
                    for (let i=0;i<pwd.length;i++) if (/[a-z]/.test(pwd[i])) lowerPositions.push(i);
                    if (lowerPositions.length === 0) return false;
                    for (let i=1;i<lowerPositions.length;i++) if (lowerPositions[i] !== lowerPositions[i-1]+1) return false;
                    return true;
                }
                case 5: return pwd.length >= 9 && /\d/.test(pwd[2]) && /\d/.test(pwd[8]);
                case 6: return pwd.toLowerCase().includes('password');
                case 7: return pwd.length >= 10 && /[A-Z]/.test(pwd[0]) && /[A-Z]/.test(pwd[9]);
                case 8: {
                    const uppers = (pwd.match(/[A-Z]/g) || []);
                    return uppers.length > 0 && uppers.every(ch => ch === 'X');
                }
                case 9: return pwd.length === 33;
                case 10: return pwd.length >= 33 && /[A-Z]/.test(pwd[32]);
                case 11: {
                    const hasEquals = /=/.test(pwd);
                    const hasOperator = /[+\-*\/]/.test(pwd);
                    const hasDigitsAround = /\d[+\-*\/=]\d/.test(pwd) || /\d[+\-*\/]\d[+\-*\/=]/.test(pwd);
                    return hasEquals && hasOperator && hasDigitsAround;
                }
                case 12: {
                    for (let i=0;i<=pwd.length-5;i++) {
                        const sub = pwd.substring(i,i+5);
                        if (/^[a-z]{5}$/.test(sub)) {
                            const codes = [...sub].map(c=>c.charCodeAt(0));
                            if (codes[1]===codes[0]+1 && codes[2]===codes[1]+1 && codes[3]===codes[2]+1 && codes[4]===codes[3]+1) return true;
                        }
                    }
                    return false;
                }
                case 13: {
                    const uppers = (pwd.match(/[A-Z]/g) || []);
                    if (uppers.length === 0) return false;
                    let sum = 0;
                    for (const ch of uppers) {
                        if (ROMAN_VALUES.hasOwnProperty(ch)) {
                            sum += ROMAN_VALUES[ch];
                        } else {
                            return false;
                        }
                    }
                    return sum === 40;
                }
                case 14: return digits.some(d => d % 4 === 0);
                case 15: {
                    const katakana = (pwd.match(/[\u30A0-\u30FF]/g) || []).length;
                    const korean = (pwd.match(/[\u1100-\u11FF\u3130-\u318F\uA960-\uA97F\uD7B0-\uD7FF]/g) || []).length;
                    return katakana >= 1 && korean >= 2;
                }
                case 16: return digits.length > 0 && digits.every(d => d % 3 !== 0);
                case 17: {
                    const isPrime = (n) => {
                        if (n < 2) return false;
                        for (let i=2;i<=Math.sqrt(n);i++) if (n%i===0) return false;
                        return true;
                    };
                    return digits.filter(d => isPrime(d)).length >= 2;
                }
                case 18: {
                    for (let i=0;i<=pwd.length-4;i++) {
                        const sub = pwd.substring(i,i+4);
                        if (/^\d{4}$/.test(sub) && MING_YEARS.has(sub)) return true;
                    }
                    return false;
                }
                case 19: {
                    // 修改：第12位和第14位（索引11和13）
                    if (pwd.length < 14) return false;
                    const c1 = pwd[11], c2 = pwd[13];
                    if (!/[a-zA-Z]/.test(c1) || !/[a-zA-Z]/.test(c2)) return false;
                    return TWO_LETTER_ELEMENTS.has((c1+c2).toLowerCase());
                }
                default: return false;
            }
        }

        function updateMainCard(index, flash=false) {
            mainCardIndex.textContent = index+1;
            mainCardText.textContent = CONDITION_TEXTS[index];
            mainCardIcon.textContent = '';
            mainCardIcon.classList.remove('show','pass','fail');
            mainCard.classList.remove('error-flash');
            if (flash) {
                mainCardIcon.textContent = '✗';
                mainCardIcon.classList.add('show','fail');
                void mainCard.offsetWidth;
                mainCard.classList.add('error-flash');
            }
            mainCard.classList.add('active');
        }

        function animateMainOut(callback) {
            if (isAnimating) return;
            isAnimating = true;
            mainCard.classList.add('slide-out');
            mainCard.addEventListener('animationend', function handler() {
                mainCard.removeEventListener('animationend', handler);
                mainCard.classList.remove('slide-out');
                mainCard.classList.add('ghost');
                callback();
            }, { once: true });
        }

        function animateMainIn(index) {
            mainCard.classList.remove('ghost');
            updateMainCard(index, false);
            mainCard.classList.remove('bounce-in');
            void mainCard.offsetWidth;
            mainCard.classList.add('bounce-in');
            mainCard.addEventListener('animationend', function handler() {
                mainCard.removeEventListener('animationend', handler);
                mainCard.classList.remove('bounce-in');
                isAnimating = false;
                scheduleDetection();
            }, { once: true });
        }

        function updateErrorPrompts(failedIndices) {
            const targetSet = new Set(failedIndices);
            const cards = [...errorStack.querySelectorAll('.error-card')];
            for (const card of cards) {
                const idx = parseInt(card.dataset.index);
                if (isNaN(idx) || !targetSet.has(idx)) {
                    card.classList.add('slide-out-error');
                    card.addEventListener('animationend', function handler() {
                        card.removeEventListener('animationend', handler);
                        if (card.parentNode) card.parentNode.removeChild(card);
                    }, { once: true });
                }
            }
            for (const [idx, el] of errorElementsMap.entries()) {
                if (!targetSet.has(idx)) {
                    if (el.parentNode && !el.classList.contains('slide-out-error')) {
                        el.classList.add('slide-out-error');
                        el.addEventListener('animationend', function handler() {
                            el.removeEventListener('animationend', handler);
                            if (el.parentNode) el.parentNode.removeChild(el);
                        }, { once: true });
                    }
                    errorElementsMap.delete(idx);
                }
            }
            for (const idx of targetSet) {
                if (errorElementsMap.has(idx)) continue;
                const old = errorStack.querySelector(`.error-card[data-index="${idx}"]`);
                if (old) { 
                    old.classList.add('slide-out-error'); 
                    old.addEventListener('animationend', function handler(){ 
                        old.removeEventListener('animationend', handler); 
                        if(old.parentNode) old.parentNode.removeChild(old); 
                    }, {once:true}); 
                }
                const errorCard = document.createElement('div');
                errorCard.className = 'error-card';
                errorCard.dataset.index = idx;
                errorCard.innerHTML = `<span class="card-index">${idx+1}</span><span class="card-text">${CONDITION_TEXTS[idx]}</span><span class="card-icon show" style="color:#e74c3c;">✗</span>`;
                let inserted = false;
                const children = [...errorStack.children];
                for (const child of children) {
                    const childIdx = parseInt(child.dataset.index);
                    if (!isNaN(childIdx) && childIdx > idx) { 
                        errorStack.insertBefore(errorCard, child); 
                        inserted = true; 
                        break; 
                    }
                }
                if (!inserted) errorStack.appendChild(errorCard);
                errorElementsMap.set(idx, errorCard);
                void errorCard.offsetWidth;
                errorCard.classList.add('popIn');
            }
            const sorted = [...errorElementsMap.entries()].sort((a,b)=>a[0]-b[0]);
            for (let i=0;i<sorted.length;i++) {
                const el = sorted[i][1];
                if (el !== errorStack.children[i]) errorStack.insertBefore(el, errorStack.children[i]||null);
            }
        }

        function getFailedPrevious(pwd) {
            const failed = [];
            for (let i=0;i<currentIndex;i++) if (!checkCondition(i, pwd)) failed.push(i);
            return failed;
        }

        let detectTimer;
        function scheduleDetection() {
            if (detectTimer) clearTimeout(detectTimer);
            detectTimer = setTimeout(performDetection, 40);
        }

        function performDetection() {
            if (gameWon) return;
            const pwd = passwordInput.value;
            charBadge.textContent = pwd.length;
            charBadge.classList.toggle('exact', pwd.length === 33);
            const currentOk = checkCondition(currentIndex, pwd);
            const failedPrev = getFailedPrevious(pwd);
            updateErrorPrompts(failedPrev);

            if (currentOk && failedPrev.length === 0) {
                mainCardIcon.textContent = '✓';
                mainCardIcon.classList.add('show','pass');
                mainCardIcon.classList.remove('fail');
                mainCard.classList.remove('error-flash');
            } else if (currentOk && failedPrev.length > 0) {
                mainCardIcon.textContent = '✓';
                mainCardIcon.classList.add('show','pass');
                mainCardIcon.classList.remove('fail');
                mainCard.classList.remove('error-flash');
            } else {
                if (!mainCard.classList.contains('error-flash')) {
                    mainCardIcon.textContent = '✗';
                    mainCardIcon.classList.add('show','fail');
                    mainCardIcon.classList.remove('pass');
                    void mainCard.offsetWidth;
                    mainCard.classList.add('error-flash');
                }
            }
            if (currentOk && failedPrev.length === 0 && !isAnimating && !gameWon) {
                if (currentIndex === 19) triggerVictory();
                else {
                    animateMainOut(() => {
                        currentIndex++;
                        updateErrorPrompts(getFailedPrevious(pwd));
                        animateMainIn(currentIndex);
                    });
                }
            }
        }

        function triggerVictory() {
            if (gameWon) return;
            gameWon = true; isAnimating = true;
            if (timerInterval) clearInterval(timerInterval);
            const elapsed = Math.floor((Date.now() - (firstInputTime||Date.now())) / 1000);
            const min = String(Math.floor(elapsed/60)).padStart(2,'0'), sec = String(elapsed%60).padStart(2,'0');
            const timeStr = `${min}:${sec}`;
            passwordInput.classList.add('win-glow'); passwordInput.readOnly = true;
            mainCard.style.borderColor = '#27ae60'; mainCard.style.background = '#e9f7ef';
            mainCardIndex.style.background = '#27ae60'; mainCardIndex.style.color = 'white';
            mainCardIcon.textContent = '🎉'; mainCardIcon.classList.add('show','pass');
            mainCardText.textContent = '🎉 完美！所有20个条件已达成。';
            errorStack.innerHTML = ''; errorElementsMap.clear();
            timerBox.textContent = `⏱ ${timeStr}`; timerBox.classList.add('visible');
            timerBox.style.color = '#27ae60'; timerBox.style.background = '#e9f7ef';
            const toast = document.createElement('div'); toast.className = 'victory-toast';
            toast.innerHTML = `🎉 恭喜通关！ 用时 <span class="time-highlight">${timeStr}</span>`;
            document.body.appendChild(toast); setTimeout(()=>toast.remove(), 5000);
            spawnEmojiRain(); isAnimating = false;
        }

        function spawnEmojiRain() {
            const emojis = ['🎉','🎊','✨','🌟','💫','🥳','🎯','💎','🔥','🏆','👑','⭐','🌈','💪','🎪','🍾','🎆','🎇','💖','🦄'];
            emojiRain.innerHTML = '';
            for (let i=0;i<50;i++) {
                const drop = document.createElement('span'); drop.className = 'rain-drop';
                drop.textContent = emojis[Math.floor(Math.random()*emojis.length)];
                drop.style.left = Math.random()*100+'%';
                drop.style.animationDuration = (Math.random()*2.5+2.2)+'s';
                drop.style.animationDelay = Math.random()*1.6+'s';
                drop.style.fontSize = (Math.random()*2+1.5)+'rem';
                emojiRain.appendChild(drop);
                const delay = parseFloat(drop.style.animationDelay)+parseFloat(drop.style.animationDuration);
                setTimeout(()=>drop.remove(), delay*1000+500);
            }
        }

        passwordInput.addEventListener('input', ()=>{
            if (gameWon) return;
            if (!firstInputTime) { firstInputTime = Date.now(); timerBox.classList.add('visible'); }
            scheduleDetection();
        });
        timerInterval = setInterval(()=>{
            if (gameWon) return;
            const ref = firstInputTime || Date.now();
            const diff = Math.floor((Date.now()-ref)/1000);
            timerBox.textContent = `⏱ ${String(Math.floor(diff/60)).padStart(2,'0')}:${String(diff%60).padStart(2,'0')}`;
            if (firstInputTime || diff>0) timerBox.classList.add('visible');
        }, 400);

        function resetGame() {
            currentIndex = 0; gameWon = false; isAnimating = false; firstInputTime = null;
            errorElementsMap.clear(); errorStack.innerHTML = '';
            passwordInput.value = ''; passwordInput.classList.remove('win-glow'); passwordInput.readOnly = false;
            charBadge.textContent = '0'; charBadge.classList.remove('exact');
            timerBox.textContent = '⏱ 00:00'; timerBox.classList.remove('visible');
            timerBox.style.color = ''; timerBox.style.background = '';
            mainCard.style.borderColor = ''; mainCard.style.background = ''; mainCardIndex.style.background = ''; mainCardIndex.style.color = '';
            mainCardIcon.textContent = ''; mainCardIcon.classList.remove('show','pass','fail');
            mainCard.classList.remove('error-flash','ghost','slide-out','bounce-in');
            updateMainCard(0, false); mainCard.classList.add('active');
            passwordInput.focus();
        }
        resetGame();
        setTimeout(()=>passwordInput.focus(), 100);
    })();
</script>

                }
            });

            directionGroup.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON' && e.target.dataset.value) {
                    const val = e.target.dataset.value;
                    if (currentMode === 'cut') {
                        cutDirection = val;
                        initRulerPositions();
                        historyStack = [
                            [...rulerPositions]
                        ];
                        updateCutSettingsUI();
                        renderRulerLines();
                    } else {
                        mergeDirection = val;
                        updateMergeDirectionUI();
                        if (mergeFiles.length > 0) buildMergePreview();
                    }
                }
            });

            zoomSelect.addEventListener('change', () => { zoomLevel = parseFloat(zoomSelect.value);
                updateTransform(); });
            btnResetZoom.addEventListener('click', resetView);

            // 键盘事件
            document.addEventListener('keydown', (e) => {
                if (modalOverlay.style.display === 'flex' || faqOverlay.style.display === 'flex') return;
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')
                    return;
                if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                    e.preventDefault();
                    if (currentMode === 'cut') undoHistory();
                    return;
                }
                if (e.key >= '2' && e.key <= '8') {
                    e.preventDefault();
                    const num = parseInt(e.key);
                    if (currentMode === 'cut' && num !== cutCount) {
                        cutCount = num;
                        initRulerPositions();
                        historyStack = [
                            [...rulerPositions]
                        ];
                        updateCutSettingsUI();
                        renderRulerLines();
                        showToast(`裁切数量切换为 ${num}`);
                    }
                    return;
                }
                if (e.key === 'a' || e.key === 'A') {
                    e.preventDefault();
                    if (currentMode === 'cut' && cutDirection !== 'vertical') {
                        cutDirection = 'vertical';
                        initRulerPositions();
                        historyStack = [
                            [...rulerPositions]
                        ];
                        updateCutSettingsUI();
                        renderRulerLines();
                    } else if (currentMode === 'merge' && mergeDirection !== 'vertical') {
                        mergeDirection = 'vertical';
                        updateMergeDirectionUI();
                        if (mergeFiles.length > 0) buildMergePreview();
                    }
                    return;
                }
                if (e.key === 'd' || e.key === 'D') {
                    e.preventDefault();
                    if (currentMode === 'cut' && cutDirection !== 'horizontal') {
                        cutDirection = 'horizontal';
                        initRulerPositions();
                        historyStack = [
                            [...rulerPositions]
                        ];
                        updateCutSettingsUI();
                        renderRulerLines();
                    } else if (currentMode === 'merge' && mergeDirection !== 'horizontal') {
                        mergeDirection = 'horizontal';
                        updateMergeDirectionUI();
                        if (mergeFiles.length > 0) buildMergePreview();
                    }
                    return;
                }
                if (e.key === 's' || e.key === 'S') {
                    e.preventDefault();
                    if ((currentMode === 'cut' && currentImageFile) || (currentMode === 'merge' && mergeFiles.length >
                            0)) {
                        btnExport.click();
                    }
                    return;
                }
                if (e.key === 'Delete') {
                    e.preventDefault();
                    if ((currentMode === 'cut' && currentImageFile) || (currentMode === 'merge' && mergeFiles.length >
                            0)) {
                        cancelImage();
                    }
                    return;
                }
                if (currentMode === 'merge' && selectedMergeIndex >= 0) {
                    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                        e.preventDefault();
                        moveSlice(-1);
                    } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                        e.preventDefault();
                        moveSlice(1);
                    }
                }
            });

            // 空格平移
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space' && !e.repeat && document.activeElement === document.body) {
                    e.preventDefault();
                    spacePressed = true;
                    editorArea.style.cursor = 'grab';
                }
            });
            document.addEventListener('keyup', (e) => {
                if (e.code === 'Space') {
                    spacePressed = false;
                    editorArea.style.cursor = '';
                    if (isPanning) stopPan();
                }
            });

            editorArea.addEventListener('mousedown', (e) => {
                if (!spacePressed || (!currentImageFile && mergeFiles.length === 0)) return;
                if (e.target.closest('.ruler-line, .handle, .settings-btn, .zoom-select, .btn-icon, .action-btn, .merge-slice-btn'))
                    return;
                e.preventDefault();
                isPanning = true;
                panStart = { x: e.clientX, y: e.clientY };
                panOffsetStart = { x: panX, y: panY };
                editorArea.style.cursor = 'grabbing';
                document.addEventListener('mousemove', onPanMove);
                document.addEventListener('mouseup', onPanUp);
            });

            function onPanMove(e) {
                if (!isPanning) return;
                panX = panOffsetStart.x + (e.clientX - panStart.x);
                panY = panOffsetStart.y + (e.clientY - panStart.y);
                updateTransform();
            }

            function onPanUp() { stopPan(); }

            function stopPan() {
                isPanning = false;
                editorArea.style.cursor = spacePressed ? 'grab' : '';
                document.removeEventListener('mousemove', onPanMove);
                document.removeEventListener('mouseup', onPanUp);
            }

            window.addEventListener('blur', () => { spacePressed = false; if (isPanning) stopPan(); });

            // ===== 按钮事件 =====
            btnExport.addEventListener('click', async () => {
                if (currentMode === 'cut') {
                    if (!currentImageFile || !originalImage) return;
                    try {
                        await exportZip(getSliceData(), true);
                        showToast('导出成功');
                    } catch (err) { showToast('导出失败'); }
                } else {
                    await exportMerged();
                }
            });

            btnReset.addEventListener('click', () => {
                if (currentMode === 'cut') {
                    initRulerPositions();
                    historyStack = [
                        [...rulerPositions]
                    ];
                    renderRulerLines();
                    showToast('已重置');
                } else {
                    if (mergeFiles.length > 0) buildMergePreview();
                    showToast('已重置');
                }
            });

            btnCancel.addEventListener('click', cancelImage);

            function cancelImage() {
                if (currentMode === 'cut') {
                    currentImageFile = null;
                    currentImageDataUrl = null;
                    originalImage = null;
                    displayImage = null;
                    displayScale = 1;
                    editorImage.src = '';
                    imageWrapper.style.display = 'none';
                    editorPlaceholder.style.display = '';
                    initRulerPositions();
                    historyStack = [
                        [...rulerPositions]
                    ];
                    imageWrapper.querySelectorAll('.ruler-line').forEach(el => el.remove());
                } else {
                    mergeFiles = [];
                    mergeCanvas = null;
                    mergeCanvasOriginal = null;
                    mergeImagesData = [];
                    selectedMergeIndex = -1;
                    editorImage.src = '';
                    imageWrapper.style.display = 'none';
                    editorPlaceholder.style.display = '';
                    imageWrapper.querySelectorAll('.merge-slice-btn').forEach(el => el.remove());
                }
                updateUploadZoneUI();
                updateButtonStates();
                resetView();
                showToast('已执行');
            }

            // ===== 窗口事件 =====
            window.addEventListener('resize', () => { if (currentImageFile || mergeFiles.length > 0) renderRulerLines(); });
            editorImage.addEventListener('load', () => {
                if (currentMode === 'cut' && currentImageFile) setTimeout(renderRulerLines, 100);
            });

            // ===== 初始化 =====
            updateButtonStates();
            updateOverlayGrid();
            initRulerPositions();
            historyStack = [
                [...rulerPositions]
            ];
            updateCutSettingsUI();
            updateUploadZoneUI();
            updateMergeDirectionUI();
            resetView();

            console.log('✨ 裁切助手已启动 (优化版: 缩略图加速)');

        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>SPACE TIME</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;background:#000;overflow:hidden;
    touch-action:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;cursor:pointer;
  }
  canvas{display:block;width:100vw;height:100vh;}
  #hint{
    position:fixed;left:50%;bottom:8%;
    transform:translateX(-50%);
    color:rgba(255,255,255,.30);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    font-weight:200;font-size:12px;letter-spacing:.7em;text-indent:.7em;
    white-space:nowrap;pointer-events:none;user-select:none;
    transition:opacity .7s cubic-bezier(.4,0,.2,1);
    animation:breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.42;}50%{opacity:1;}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hint">长 按 圆 圈</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('scene');
  const ctx    = canvas.getContext('2d', { alpha: false });
  const hintEl = document.getElementById('hint');

  /* ================= 基础工具 ================= */
  let W = 0, H = 0, cx = 0, cy = 0, DPR = 1, maxR = 0;

  function smoothstep(a, b, x){
    const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }
  function fadeOut(a, b, x){ return 1 - smoothstep(a, b, x); }

  /* ================= 精灵预渲染 ================= */
  function makeGlow(r, g, b, size){
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    const gd = x.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    gd.addColorStop(0,    'rgba(' + r + ',' + g + ',' + b + ',1)');
    gd.addColorStop(0.18, 'rgba(' + r + ',' + g + ',' + b + ',0.45)');
    gd.addColorStop(0.50, 'rgba(' + r + ',' + g + ',' + b + ',0.11)');
    gd.addColorStop(1,    'rgba(' + r + ',' + g + ',' + b + ',0)');
    x.fillStyle = gd;
    x.fillRect(0, 0, size, size);
    return c;
  }
  function makeFlash(size){
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    const gd = x.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    gd.addColorStop(0,    'rgba(255,255,255,1)');
    gd.addColorStop(0.30, 'rgba(255,255,255,0.88)');
    gd.addColorStop(0.62, 'rgba(206,234,255,0.34)');
    gd.addColorStop(1,    'rgba(150,196,255,0)');
    x.fillStyle = gd;
    x.fillRect(0, 0, size, size);
    return c;
  }

  const spWhite  = makeGlow(255, 255, 255, 128);
  const spBlue   = makeGlow(120, 185, 255, 128);
  const spCyan   = makeGlow(110, 255, 238, 128);
  const spViolet = makeGlow(178, 140, 255, 128);
  const spGold   = makeGlow(255, 214, 130, 128);
  const spPink   = makeGlow(255, 140, 212, 128);
  const spGreen  = makeGlow(120, 255, 140, 128);
  const spFlash  = makeFlash(256);
  const PART_SPRITES = [spWhite, spCyan, spGold, spViolet, spPink, spGreen];

  /* ================= 音频 ================= */
  const MUSIC_URLS = [
    'https://cdn.jsdelivr.net/gh/zrzbc/syti-ai/spacesound.wav',
    'https://cdn.jsdelivr.net/gh/zrzbc/syti-ai@master/spacesound.wav',
    'https://raw.githubusercontent.com/zrzbc/syti-ai/main/spacesound.wav',
    'https://fastly.jsdelivr.net/gh/zrzbc/syti-ai@main/spacesound.wav'
  ];
  const FADE_TIME = 3;           // 松手时音乐淡出时长（秒）

  let audioCtx    = null;
  let musicBuffer = null;
  let musicSource = null;
  let musicGain   = null;
  let musicLoaded = false;
  let fadeTimer   = null;

  /* 预加载 + 解码（依次尝试多个 URL） */
  function preloadMusic(){
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e){
      console.warn('Web Audio 不可用：', e);
      return;
    }

    let idx = 0;
    function tryNext(){
      if (idx >= MUSIC_URLS.length){
        console.warn('所有音频地址均加载失败，请检查 URL 或网络');
        return;
      }
      const url = MUSIC_URLS[idx++];
      console.log('尝试加载音频：', url);

      fetch(url, { mode: 'cors' })
        .then(function(res){
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.arrayBuffer();
        })
        .then(function(buf){
          return audioCtx.decodeAudioData(buf);
        })
        .then(function(decoded){
          musicBuffer = decoded;
          musicLoaded = true;
          console.log('音频加载成功，时长 ' + decoded.duration.toFixed(1) + ' 秒');
        })
        .catch(function(err){
          console.warn('地址失败：' + url + ' → ' + err.message);
          tryNext();   // 自动试下一个
        });
    }
    tryNext();
  }
  preloadMusic();

  /* 播放音乐（从头开始） */
  function startMusic(){
    if (!audioCtx || !musicBuffer) return;

    if (audioCtx.state === 'suspended'){
      audioCtx.resume();
    }

    // 若已存在 source，先立即销毁（避免叠加）
    if (musicSource){
      try { musicSource.stop(); } catch (e) {}
      try { musicSource.disconnect(); } catch (e) {}
      musicSource = null;
    }
    if (fadeTimer){
      clearTimeout(fadeTimer);
      fadeTimer = null;
    }

    musicSource = audioCtx.createBufferSource();
    musicSource.buffer = musicBuffer;
    musicSource.loop   = false;

    musicGain = audioCtx.createGain();
    musicGain.gain.value = 1;

    musicSource.connect(musicGain);
    musicGain.connect(audioCtx.destination);

    try {
      musicSource.start(0);
    } catch (e){
      console.warn('音频启动失败：', e);
    }
  }

  /* 停止音乐（渐变消失 → 再断开） */
  function stopMusicSmooth(){
    if (!audioCtx || !musicSource || !musicGain) return;

    const now = audioCtx.currentTime;
    const g   = musicGain.gain;

    try { g.cancelScheduledValues(now); } catch (e) {}
    g.setValueAtTime(g.value, now);

    try {
      g.exponentialRampToValueAtTime(0.0001, now + FADE_TIME);
    } catch (e) {
      g.linearRampToValueAtTime(0.0001, now + FADE_TIME);
    }

    const srcToStop = musicSource;
    musicSource = null;
    musicGain   = null;

    if (fadeTimer) clearTimeout(fadeTimer);
    fadeTimer = setTimeout(function(){
      try { srcToStop.stop(); } catch (e) {}
      try { srcToStop.disconnect(); } catch (e) {}
      fadeTimer = null;
    }, FADE_TIME * 1000 + 60);
  }

  /* 立即停止（用于重置/隐藏页面） */
  function stopMusicImmediate(){
    if (fadeTimer){
      clearTimeout(fadeTimer);
      fadeTimer = null;
    }
    if (musicSource){
      try { musicSource.stop(); } catch (e) {}
      try { musicSource.disconnect(); } catch (e) {}
      musicSource = null;
    }
    musicGain = null;
  }

  /* 播放音乐（从头开始） */
  function startMusic(){
    if (!audioCtx || !musicBuffer) return;

    // 解锁 AudioContext（iOS / 移动端必须由用户手势触发）
    if (audioCtx.state === 'suspended'){
      audioCtx.resume();
    }

    // 若已存在 source，先立即销毁（避免叠加）
    if (musicSource){
      try { musicSource.stop(); } catch (e) {}
      try { musicSource.disconnect(); } catch (e) {}
      musicSource = null;
    }
    if (fadeTimer){
      clearTimeout(fadeTimer);
      fadeTimer = null;
    }

    // 创建新的 source + gain
    musicSource = audioCtx.createBufferSource();
    musicSource.buffer = musicBuffer;
    musicSource.loop   = false;   // 不循环，音频 40 秒左右正好覆盖动画

    musicGain = audioCtx.createGain();
    musicGain.gain.value = 1;     // 从满音量开始

    musicSource.connect(musicGain);
    musicGain.connect(audioCtx.destination);

    try {
      musicSource.start(0);
    } catch (e){
      console.warn('音频启动失败：', e);
    }
  }

  /* 停止音乐（渐变消失 → 再断开） */
  function stopMusicSmooth(){
    if (!audioCtx || !musicSource || !musicGain) return;

    const now = audioCtx.currentTime;
    const g   = musicGain.gain;

    // 取消任何已排队的自动化，避免冲突
    try { g.cancelScheduledValues(now); } catch (e) {}
    g.setValueAtTime(g.value, now);

    // 指数渐变到极小值（指数不能到 0，用 0.0001 近似静音）
    try {
      g.exponentialRampToValueAtTime(0.0001, now + FADE_TIME);
    } catch (e) {
      g.linearRampToValueAtTime(0.0001, now + FADE_TIME);
    }

    // 记录待清理的 source，避免变量被覆盖后无法 stop
    const srcToStop = musicSource;
    musicSource = null;
    musicGain   = null;

    if (fadeTimer) clearTimeout(fadeTimer);
    fadeTimer = setTimeout(function(){
      try { srcToStop.stop(); } catch (e) {}
      try { srcToStop.disconnect(); } catch (e) {}
      fadeTimer = null;
    }, FADE_TIME * 1000 + 60);
  }

  /* 立即停止（用于重置/隐藏页面，不做渐变） */
  function stopMusicImmediate(){
    if (fadeTimer){
      clearTimeout(fadeTimer);
      fadeTimer = null;
    }
    if (musicSource){
      try { musicSource.stop(); } catch (e) {}
      try { musicSource.disconnect(); } catch (e) {}
      musicSource = null;
    }
    musicGain = null;
  }

  /* ================= 时间轴 ================= */
  const TOTAL = 40;

  const EXPLOSIONS = [
    { t: 16, scale: 0.55, flash: 0.35 },
    { t: 27, scale: 1.10, flash: 0.70 },
    { t: 35, scale: 2.20, flash: 1.00 }
  ];

  let T = 0;
  let act = 0;
  let held = false;
  let wasHeld = false;
  let hasFinished = false;
  let lastTime = performance.now();
  let shakeMag = 0;
  let flashAge = 999;
  let flashStrength = 1;
  let explosionIdx = 0;

  /* ================= 色相 ================= */
  const HUE_KEYS = [
    { t: 0,  h: 215 }, { t: 6,  h: 200 },
    { t: 12, h: 260 }, { t: 18, h: 180 },
    { t: 24, h: 130 }, { t: 30, h: 300 },
    { t: 35, h: 30  }, { t: 40, h: 215 }
  ];
  function hueAt(t){
    for (let i = 0; i < HUE_KEYS.length - 1; i++){
      const a = HUE_KEYS[i], b = HUE_KEYS[i+1];
      if (t >= a.t && t <= b.t){
        const k = (t - a.t) / (b.t - a.t);
        return a.h + (b.h - a.h) * k;
      }
    }
    return 215;
  }

  /* ================= 场景权重 ================= */
  function sceneWeights(t){
    return {
      ripple  : smoothstep(0, 0.5, t)     * fadeOut(3.5, 5.5, t),
      stars   : smoothstep(3, 5, t)       * fadeOut(8.5, 11, t),
      city    : smoothstep(7, 9.5, t)     * fadeOut(15, 17.5, t),
      matrix  : smoothstep(12, 14.5, t)   * fadeOut(20, 22.5, t),
      dna     : smoothstep(14, 17, t)     * fadeOut(26, 29, t),
      ecg     : smoothstep(15.5, 18, t)   * fadeOut(26, 29, t),
      hole    : smoothstep(23, 30, t)     * fadeOut(34, 40, t),
      collapse: smoothstep(33, 39, t)     * fadeOut(39, 40, t)
    };
  }

  /* ================= 星星 ================= */
  let stars = [];
  function makeStar(spread){
    return {
      a: Math.random() * Math.PI * 2,
      r: spread ? Math.random() * 1.15 : Math.random() * 0.05,
      sp: 0.35 + Math.random() * 1.15,
      sz: 0.4 + Math.random() * 1.4,
      br: 0.30 + Math.random() * 0.70,
      tw: Math.random() * Math.PI * 2,
      tws: 0.5 + Math.random() * 2.0,
      ci: Math.random() < 0.62 ? 0 : (Math.random() < 0.5 ? 1 : 2)
    };
  }
  function initStars(){
    const n = Math.min(300, Math.max(80, Math.round(W * H / 5000)));
    stars = [];
    for (let i = 0; i < n; i++) stars.push(makeStar(true));
  }

  /* ================= 3D 城市 ================= */
  const FOV = 620;
  let buildings = [];
  let camX = 0, camY = 90;

  function newBuilding(z){
    const side = Math.random() < 0.5 ? -1 : 1;
    return {
      x: side * (200 + Math.random() * 520),
      z: z,
      w: 24 + Math.random() * 72,
      h: 100 + Math.random() * 560,
      hue: 180 + Math.random() * 110
    };
  }
  function initCity(){
    buildings = [];
    for (let i = 0; i < 120; i++) buildings.push(newBuilding(60 + Math.random() * 1650));
    buildings.sort(function(a, b){ return b.z - a.z; });
  }

  /* ================= 绿色乱码 ================= */
  const MATRIX_CHARS = '01アカサタナハマヤラワ0123456789<>{}[]()/*+=!@#$%';
  const MATRIX_COL_W = 18;
  const MATRIX_CHAR_H = 20;
  const matrixCols = [];
  function initMatrix(){
    matrixCols.length = 0;
    const n = Math.ceil(W / MATRIX_COL_W) + 2;
    for (let i = 0; i < n; i++){
      matrixCols.push({
        x: i * MATRIX_COL_W + MATRIX_COL_W / 2,
        speed: 60 + Math.random() * 180,
        headY: Math.random() * (H + 400) - 200,
        trail: 10 + Math.floor(Math.random() * 12),
        seed: Math.random() * 999
      });
    }
  }

  /* ================= 粒子 / 冲击波 / 螺旋 ================= */
  const parts = [];
  const rings = [];
  const spiral = [];

  function spawnExplosion(scale){
    scale = scale || 1;
    const n = Math.floor(180 * scale);
    for (let i = 0; i < n; i++){
      const a  = Math.random() * Math.PI * 2;
      const sp = (70 + Math.pow(Math.random(), 0.55) * 1100) * scale;
      parts.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        decay: 0.28 + Math.random() * 0.72,
        sz: (3 + Math.random() * 9) * scale,
        ci: (Math.random() * PART_SPRITES.length) | 0,
        drag: 0.86 + Math.random() * 0.28
      });
    }
    const rn = Math.max(2, Math.floor(3 * scale));
    for (let i = 0; i < rn; i++){
      rings.push({
        r: 0,
        sp: (620 + i * 360) * scale,
        life: 1,
        w: (12 - i * 2.2) * Math.min(1.6, scale)
      });
    }
  }

  function initSpiral(){
    spiral.length = 0;
    const n = 240;
    for (let i = 0; i < n; i++){
      spiral.push({
        a: Math.random() * Math.PI * 2,
        r: 90 + Math.random() * maxR * 1.05,
        sp: 0.35 + Math.random() * 0.75,
        sz: 1.2 + Math.random() * 3.0,
        ci: (Math.random() * PART_SPRITES.length) | 0,
        life: 0.5 + Math.random() * 0.5
      });
    }
  }

  /* ================= 波纹 ================= */
  const ripples = [];
  let rippleTimer = 0;

  /* ================= 尺寸 ================= */
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2;
    cy = H / 2;
    maxR = Math.hypot(W, H) * 0.62;
    initStars();
    initCity();
    initSpiral();
    initMatrix();
    ripples.length = 0;
    parts.length = 0;
    rings.length = 0;
    rippleTimer = 0;
  }

  /* ================= 清空场景 ================= */
  function clearScene(){
    T = 0;
    act = 0;
    shakeMag = 0;
    flashAge = 999;
    flashStrength = 1;
    explosionIdx = 0;
    parts.length = 0;
    rings.length = 0;
    ripples.length = 0;
    rippleTimer = 0;
    initSpiral();
    initStars();
    initCity();
    initMatrix();
  }

  /* ================= 心电图波形 ================= */
  function ecgPulse(u){
    let v = 0;
    v += -0.10 * Math.exp(-Math.pow((u - 0.155) / 0.013, 2));
    v +=  1.00 * Math.exp(-Math.pow((u - 0.192) / 0.011, 2));
    v += -0.30 * Math.exp(-Math.pow((u - 0.232) / 0.016, 2));
    v +=  0.19 * Math.exp(-Math.pow((u - 0.430) / 0.048, 2));
    return v;
  }

  /* ================= 背景辉光 ================= */
  function drawBgGlow(t, w){
    if (w <= 0.004) return;
    const h = hueAt(t);
    const R = maxR * 1.1;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
    g.addColorStop(0,    'hsla(' + h + ',70%,18%,' + (0.60 * w) + ')');
    g.addColorStop(0.40, 'hsla(' + (h + 25) + ',65%,9%,' + (0.22 * w) + ')');
    g.addColorStop(1,    'hsla(0,0%,0%,0)');
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  /* ================= 场景 1：波纹 ================= */
  function updateRipples(dt, t, w){
    if (w < 0.02){ rippleTimer = 0; return; }

    if (ripples.length === 0){
      ripples.push({ r: maxR * 0.16, sp: 0.17, wd: 1.3 });
      ripples.push({ r: maxR * 0.05, sp: 0.20, wd: 1.0 });
      ripples.push({ r: 0,           sp: 0.22, wd: 0.8 });
      rippleTimer = 0;
    }

    const interval = 1.6 - 0.9 * Math.min(1, t / 5);
    const spd      = 0.16 + 0.24 * Math.min(1, t / 5);
    rippleTimer += dt;
    let guard = 0;
    while (rippleTimer > interval && guard++ < 5){
      rippleTimer -= interval;
      ripples.push({
        r: 0,
        sp: spd * (0.85 + Math.random() * 0.30),
        wd: 0.7 + Math.random() * 0.7
      });
    }

    for (let i = ripples.length - 1; i >= 0; i--){
      const rp = ripples[i];
      rp.r += dt * rp.sp * maxR;
      if (rp.r > maxR * 1.15) ripples.splice(i, 1);
    }
    if (ripples.length > 24) ripples.splice(0, ripples.length - 24);
  }

  function drawRipples(t, w, collapse){
    if (w <= 0.004) return;
    const h = hueAt(t);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < ripples.length; i++){
      const rp = ripples[i];
      const R = rp.r * (1 - collapse * 0.9);
      if (R < 0.6) continue;
      const prog = Math.min(1, rp.r / (maxR * 1.15));
      const a = (1 - prog) * (1 - prog) * w * 0.68;
      if (a <= 0.004) continue;
      const lw = (0.8 + prog * 6.5) * rp.wd;
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.lineWidth = lw;
      ctx.strokeStyle = 'hsla(' + h + ',88%,72%,' + a + ')';
      ctx.stroke();
      const R2 = R - lw * 0.62;
      if (R2 > 0.5){
        ctx.beginPath();
        ctx.arc(cx, cy, R2, 0, Math.PI * 2);
        ctx.lineWidth = Math.max(0.5, lw * 0.32);
        ctx.strokeStyle = 'hsla(' + (h + 22) + ',100%,92%,' + (a * 0.72) + ')';
        ctx.stroke();
      }
    }
  }

  /* ================= 场景 2：星空 ================= */
  function drawStars(dt, gt, t, w){
    if (w <= 0.004) return;
    const speed = 0.055 + 0.045 * Math.sin(gt * 0.4);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < stars.length; i++){
      const s = stars[i];
      s.r += dt * speed * s.sp;
      if (s.r > 1.22){ stars[i] = makeStar(false); continue; }
      const R = s.r * maxR;
      const x = cx + Math.cos(s.a) * R;
      const y = cy + Math.sin(s.a) * R;
      const fin  = Math.min(1, s.r / 0.06);
      const fout = Math.min(1, (1.22 - s.r) / 0.30);
      const twk  = 0.55 + 0.45 * Math.sin(gt * s.tws + s.tw);
      const a    = fin * fout * twk * s.br * w;
      if (a <= 0.006) continue;
      const size = (2.2 + s.sz * 5.0) * (0.55 + s.r * 0.9);
      const spr  = s.ci === 0 ? spWhite : (s.ci === 1 ? spCyan : spViolet);
      ctx.globalAlpha = a;
      ctx.drawImage(spr, x - size / 2, y - size / 2, size, size);
    }
    ctx.globalAlpha = 1;
  }

  /* ================= 场景 3：3D 城市 ================= */
  function updateCity(dt, speed){
    const v = dt * speed * 340;
    for (let i = 0; i < buildings.length; i++){
      const b = buildings[i];
      b.z -= v;
      if (b.z < 28) buildings[i] = newBuilding(1700 + Math.random() * 260);
    }
    buildings.sort(function(a, b){ return b.z - a.z; });
  }

  function drawCity(gt, w){
    if (w <= 0.004) return;

    camY = 90 + Math.sin(gt * 0.5) * 26;
    camX = Math.sin(gt * 0.33) * 55;

    ctx.globalCompositeOperation = 'lighter';

    const S = 180, zNear = 40, zFar = 1850;
    const gridA = w * 0.85;
    if (gridA > 0.01){
      ctx.lineWidth = 1;
      for (let gx = -950; gx <= 950; gx += S){
        const sN = FOV / zNear, sF = FOV / zFar;
        const xN = cx + (gx - camX) * sN, yN = cy + camY * sN;
        const xF = cx + (gx - camX) * sF, yF = cy + camY * sF;
        ctx.beginPath();
        ctx.moveTo(xN, yN);
        ctx.lineTo(xF, yF);
        ctx.strokeStyle = 'hsla(200,82%,62%,' + (0.08 * gridA) + ')';
        ctx.stroke();
      }
      const off = (gt * 320) % S;
      for (let gz = zNear; gz < zFar; gz += S){
        const z = gz - off + S;
        if (z < zNear) continue;
        const s = FOV / z;
        const y = cy + camY * s;
        if (y < -50 || y > H + 50) continue;
        const x0 = cx + (-950 - camX) * s;
        const x1 = cx + ( 950 - camX) * s;
        const fd = 1 - (z - zNear) / (zFar - zNear);
        ctx.beginPath();
        ctx.moveTo(x0, y);
        ctx.lineTo(x1, y);
        ctx.strokeStyle = 'hsla(198,85%,64%,' + (0.13 * gridA * fd) + ')';
        ctx.stroke();
      }
    }

    ctx.lineJoin = 'round';
    for (let i = 0; i < buildings.length; i++){
      const b = buildings[i];
      if (b.z <= 25) continue;
      const s = FOV / b.z;
      const bx = cx + (b.x - camX) * s;
      const yBase = cy + camY * s;
      const yTop  = cy + (camY - b.h) * s;
      const bw   = b.w * s;
      if (bx + bw < -80 || bx - bw > W + 80) continue;
      if (yBase < -80 || yTop > H + 80) continue;
      const near = Math.min(1, (1850 - b.z) / 1500);
      const a = w * (0.08 + 0.42 * near);
      if (a <= 0.006) continue;
      ctx.lineWidth = Math.max(0.5, Math.min(3.2, s * 1.0));
      ctx.strokeStyle = 'hsla(' + b.hue + ',88%,' + (58 + 16 * near) + '%,' + a + ')';
      ctx.strokeRect(bx - bw / 2, yTop, bw, yBase - yTop);
      if (bw > 3){
        ctx.beginPath();
        ctx.moveTo(bx - bw / 2, yTop);
        ctx.lineTo(bx + bw / 2, yTop);
        ctx.lineWidth = Math.max(0.6, Math.min(4, s * 1.6));
        ctx.strokeStyle = 'hsla(' + (b.hue + 20) + ',100%,82%,' + (a * 1.6) + ')';
        ctx.stroke();
      }
    }
  }

  /* ================= 场景 4：心电图 ================= */
  function drawECG(gt, t, w, collapse){
    if (w <= 0.005) return;
    const h = hueAt(t);
    const baseAmp = Math.min(H * 0.055, 74) * (1 - collapse * 0.85);
    if (baseAmp <= 1) return;

    const ampMod = 0.55
                 + 0.32 * Math.sin(gt * 0.95)
                 + 0.20 * Math.sin(gt * 2.55 + 1.2)
                 + 0.12 * Math.sin(gt * 4.30 + 0.5);
    const amp = baseAmp * Math.max(0.35, ampMod);

    const waveLen = Math.max(200, W * 0.17);
    const halfW   = W * 0.76;
    const x0 = cx - halfW, x1 = cx + halfW;
    const beat = 0.82 + 0.18 * Math.sin(gt * 3.0);

    const pts = [];
    const step = Math.max(2, W / 480);
    for (let x = x0; x <= x1; x += step){
      let u = (((x - cx) / waveLen) - gt * 0.52) % 1;
      if (u < 0) u += 1;
      const v = ecgPulse(u);
      const localMod = 0.85 + 0.15 * Math.sin(x * 0.008 + gt * 1.3);
      pts.push(x, cy + v * amp * beat * localMod);
    }
    if (pts.length < 4) return;

    ctx.globalCompositeOperation = 'lighter';

    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.lineWidth = 8;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'hsla(' + (h + 8) + ',92%,70%,' + (0.13 * w) + ')';
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'hsla(' + (h + 8) + ',100%,90%,' + (0.76 * w) + ')';
    ctx.stroke();

    for (let i = 0; i < pts.length; i += 2){
      if ((i >> 1) % 10) continue;
      ctx.globalAlpha = 0.11 * w;
      ctx.drawImage(spWhite, pts[i] - 9, pts[i + 1] - 9, 18, 18);
    }
    ctx.globalAlpha = 1;
  }

  /* ================= 场景 5：DNA 螺旋 ================= */
  function drawDNA(gt, t, w){
    if (w <= 0.005) return;

    const R = Math.min(W, H) * 0.20;
    const spacing = 28;
    const speed = 130;
    const N = Math.ceil(H / spacing) + 8;
    const scroll = (gt * speed) % spacing;
    const h = hueAt(t);

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 1.4;

    for (let i = 0; i < N; i++){
      const screenY = i * spacing - scroll;
      if (screenY < -60 || screenY > H + 60) continue;

      const phase = i * 0.48 + gt * 1.6;
      const cosP = Math.cos(phase);
      const sinP = Math.sin(phase);
      const x1 = cx + cosP * R;
      const x2 = cx - cosP * R;
      const z1 = sinP;
      const z2 = -sinP;

      const sc1 = 1 + z1 * 0.38;
      const sc2 = 1 + z2 * 0.38;
      const a1 = w * (0.28 + 0.62 * (z1 * 0.5 + 0.5));
      const a2 = w * (0.28 + 0.62 * (z2 * 0.5 + 0.5));

      if (i % 2 === 0){
        const aMix = (a1 + a2) * 0.25;
        if (aMix > 0.006){
          ctx.strokeStyle = 'hsla(' + h + ',85%,72%,' + aMix + ')';
          ctx.beginPath();
          ctx.moveTo(x1, screenY);
          ctx.lineTo(x2, screenY);
          ctx.stroke();
        }
      }

      const sz1 = 14 * sc1;
      const sz2 = 14 * sc2;
      ctx.globalAlpha = a1;
      ctx.drawImage(spCyan, x1 - sz1 / 2, screenY - sz1 / 2, sz1, sz1);
      ctx.globalAlpha = a2;
      ctx.drawImage(spPink, x2 - sz2 / 2, screenY - sz2 / 2, sz2, sz2);
    }
    ctx.globalAlpha = 1;
  }

  /* ================= 场景 6：绿色乱码 ================= */
  function updateMatrix(dt, w){
    if (w <= 0.005) return;
    for (let i = 0; i < matrixCols.length; i++){
      const c = matrixCols[i];
      c.headY += dt * c.speed;
      if (c.headY > H + 400){
        c.headY = -200 - Math.random() * 200;
        c.speed = 60 + Math.random() * 180;
        c.trail = 10 + Math.floor(Math.random() * 12);
        c.seed = Math.random() * 999;
      }
    }
  }

  function drawMatrix(gt, w){
    if (w <= 0.005) return;

    ctx.globalCompositeOperation = 'source-over';
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const tick = Math.floor(gt * 8);

    for (let i = 0; i < matrixCols.length; i++){
      const c = matrixCols[i];
      for (let j = 0; j < c.trail; j++){
        const y = c.headY - j * MATRIX_CHAR_H;
        if (y < -MATRIX_CHAR_H || y > H + MATRIX_CHAR_H) continue;

        const fade = 1 - j / c.trail;
        let a = fade * fade * w * 0.95;
        if (j === 0) a = w;
        if (a <= 0.01) continue;

        const idx = Math.floor(
          (Math.sin(i * 7.13 + j * 3.71 + tick + c.seed) * 0.5 + 0.5)
          * MATRIX_CHARS.length
        ) % MATRIX_CHARS.length;
        const ch = MATRIX_CHARS[idx];

        if (j === 0){
          ctx.fillStyle = 'rgba(220,255,230,' + a + ')';
        } else {
          const lum = 42 + fade * 28;
          ctx.fillStyle = 'hsla(' + (118 + (i % 7) * 4) + ',100%,' + lum + '%,' + a + ')';
        }
        ctx.fillText(ch, c.x, y);
      }
    }
    ctx.globalAlpha = 1;
  }

  /* ================= 场景 7：黑洞 ================= */
  function drawBlackHole(gt, t, w, energy){
    if (w <= 0.005) return;
    const h = 38;
    const R = 46 + energy * 34;

    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < 9; i++){
      const k = i / 9;
      const a = w * (0.34 - k * 0.025);
      const rr = R * (1 + k * 1.9);
      const rot = gt * (0.55 + k * 0.25);
      ctx.beginPath();
      ctx.ellipse(cx, cy, rr, rr * 0.22, rot, 0, Math.PI * 2);
      ctx.lineWidth = 2.2 - k * 0.18;
      ctx.strokeStyle = 'hsla(' + (h + k * 22) + ',100%,' + (72 - k * 4) + '%,' + a + ')';
      ctx.stroke();
    }

    ctx.globalCompositeOperation = 'source-over';
    const g = ctx.createRadialGradient(cx, cy, R * 0.3, cx, cy, R * 1.5);
    g.addColorStop(0,   'rgba(0,0,0,' + (0.95 * w + 0.05) + ')');
    g.addColorStop(0.55,'rgba(0,0,0,' + (0.88 * w) + ')');
    g.addColorStop(0.82,'hsla(' + h + ',90%,62%,' + (0.40 * w) + ')');
    g.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, R * 1.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.lineWidth = 2.2;
    ctx.strokeStyle = 'hsla(' + (h + 12) + ',100%,80%,' + (w * 0.80) + ')';
    ctx.stroke();
  }

  function updateSpiral(dt, w, energy, collapse){
    if (w <= 0.005) return;
    const pull = 0.55 + energy * 1.6 + collapse * 2.2;
    for (let i = 0; i < spiral.length; i++){
      const p = spiral[i];
      p.r -= p.r * dt * pull * p.sp;
      p.a += dt * (1.8 + energy * 4.2 + collapse * 3.0) * p.sp;
      if (p.r < 6){
        p.r = maxR * (0.9 + Math.random() * 0.6);
        p.a = Math.random() * Math.PI * 2;
      }
    }
  }

  function drawSpiral(t, w){
    if (w <= 0.005) return;
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < spiral.length; i++){
      const p = spiral[i];
      const x = cx + Math.cos(p.a) * p.r;
      const y = cy + Math.sin(p.a) * p.r * 0.72;
      const fade = Math.min(1, p.r / (maxR * 0.7));
      const a = w * 0.78 * fade * p.life;
      if (a <= 0.006) continue;
      const sz = p.sz * 10;
      ctx.globalAlpha = a;
      ctx.drawImage(PART_SPRITES[p.ci], x - sz / 2, y - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;
  }

  /* ================= 粒子 / 冲击波 ================= */
  function updateParticles(dt, collapse){
    for (let i = parts.length - 1; i >= 0; i--){
      const p = parts[i];
      if (collapse > 0.02){
        const dx = cx - p.x, dy = cy - p.y;
        const d  = Math.hypot(dx, dy) + 1;
        p.vx += (dx / d) * 900 * dt * collapse;
        p.vy += (dy / d) * 900 * dt * collapse;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const k = Math.pow(p.drag, dt * 60);
      p.vx *= k;
      p.vy *= k;
      p.life -= p.decay * dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
    if (parts.length > 700) parts.splice(0, parts.length - 700);

    for (let i = rings.length - 1; i >= 0; i--){
      const r = rings[i];
      r.r += r.sp * dt;
      r.life -= dt * 0.55;
      if (r.life <= 0) rings.splice(i, 1);
    }
  }

  function drawParticles(t, w){
    if (w <= 0.004) return;
    const h = hueAt(t);
    ctx.globalCompositeOperation = 'lighter';

    for (let i = 0; i < parts.length; i++){
      const p = parts[i];
      const a = p.life * p.life * w * 0.95;
      if (a <= 0.006) continue;
      const sz = p.sz * (0.5 + p.life * 1.1) * 2.6;
      ctx.globalAlpha = a;
      ctx.drawImage(PART_SPRITES[p.ci], p.x - sz / 2, p.y - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;

    for (let i = 0; i < rings.length; i++){
      const r = rings[i];
      const a = r.life * r.life * w * 0.55;
      if (a <= 0.005) continue;
      ctx.beginPath();
      ctx.arc(cx, cy, r.r, 0, Math.PI * 2);
      ctx.lineWidth = Math.max(0.6, r.w * r.life);
      ctx.strokeStyle = 'hsla(' + h + ',92%,78%,' + a + ')';
      ctx.stroke();
    }
  }

  /* ================= 白闪 ================= */
  function drawFlash(age, strength){
    if (age > 3.2) return;
    strength = strength || 1;

    if (age < 0.5){
      const k = age / 0.5;
      const e = 1 - Math.pow(1 - k, 3);
      const R = maxR * 1.8 * e;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 1;
      ctx.drawImage(spFlash, cx - R, cy - R, R * 2, R * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + (0.88 * strength * (1 - k) * (1 - k)) + ')';
      ctx.fillRect(0, 0, W, H);
    } else {
      const k = (age - 0.5) / 2.7;
      const a = (1 - k) * (1 - k) * 0.85 * strength;
      const R = maxR * 1.8 * (1 + k * 0.55);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = a;
      ctx.drawImage(spFlash, cx - R, cy - R, R * 2, R * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + (0.10 * strength * (1 - k) * (1 - k)) + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  /* ================= 暗角 ================= */
  function drawVignette(){
    const inner = Math.min(W, H) * 0.11;
    const outer = Math.max(W, H) * 0.78;
    const g = ctx.createRadialGradient(cx, cy, inner, cx, cy, outer);
    g.addColorStop(0,    'rgba(0,0,0,0)');
    g.addColorStop(0.50, 'rgba(0,0,0,0.30)');
    g.addColorStop(0.78, 'rgba(0,0,0,0.66)');
    g.addColorStop(1,    'rgba(0,0,0,0.95)');
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  /* ================= 中心核心 ================= */
  function drawCore(gt, energy){
    const pulse = Math.sin(gt * 1.9) * 0.5 + 0.5;
    const R = 20 + pulse * 2.2 + energy * 6;
    const glowR = R * (6 + energy * 10);

    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
    g.addColorStop(0,    'rgba(255,255,255,' + (0.38 + 0.32 * energy) + ')');
    g.addColorStop(0.06, 'rgba(200,232,255,' + (0.17 + 0.21 * energy) + ')');
    g.addColorStop(0.28, 'rgba(120,180,255,' + (0.04 + 0.09 * energy) + ')');
    g.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
    ctx.fill();

    const ringR = R + 10 + pulse * 5 + energy * 12;
    ctx.beginPath();
    ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(180,220,255,' + (0.08 + 0.16 * energy) + ')';
    ctx.stroke();

    ctx.globalCompositeOperation = 'source-over';
    const cg = ctx.createRadialGradient(
      cx - R * 0.28, cy - R * 0.34, R * 0.06,
      cx, cy, R
    );
    cg.addColorStop(0,   '#ffffff');
    cg.addColorStop(0.60,'#f3f9ff');
    cg.addColorStop(1,   '#c9e2ff');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ================= 主循环 ================= */
  function frame(now){
    requestAnimationFrame(frame);

    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (!isFinite(dt) || dt < 0) dt = 0;
    if (dt > 0.05) dt = 0.05;

    const gt = now / 1000;

    /* ---- 检测"新按下"：若已播放完毕，重新开始 ---- */
    if (held && !wasHeld && hasFinished){
      clearScene();
      hasFinished = false;
    }

    /* ---- 活跃度 / 进度 ---- */
    if (held){
      if (!hasFinished){
        act = Math.min(1, act + dt * 8.0);
        T += dt;
        if (T >= TOTAL){
          T = TOTAL;
          hasFinished = true;
          stopMusicSmooth();   // 动画结束 → 音乐平滑淡出
        }
      }
    } else {
      act = Math.max(0, act - dt * 2.0);
      if (act <= 0.01){
        act = 0;
        hasFinished = false;
        clearScene();
      }
    }

    const A = act;

    /* ---- 三次爆炸 ---- */
    while (explosionIdx < EXPLOSIONS.length && T >= EXPLOSIONS[explosionIdx].t){
      const E = EXPLOSIONS[explosionIdx];
      spawnExplosion(E.scale);
      flashAge = 0;
      flashStrength = E.flash;
      shakeMag = Math.max(shakeMag, 8 + E.scale * 14);
      explosionIdx++;
    }
    if (flashAge < 900) flashAge += dt;

    /* ---- 权重 ---- */
    const SW = sceneWeights(T);
    const collapse = SW.collapse;

    let energy = SW.hole;
    energy = Math.max(energy, collapse * 0.9);

    /* ---- 平滑震动 ---- */
    let targetShake = 0;
    if (flashAge < 1.8) targetShake = Math.max(targetShake, 26 * (1 - flashAge / 1.8) * flashStrength);
    if (collapse > 0.02) targetShake = Math.max(targetShake, 14 * collapse);
    if (T > 26 && T < 34) targetShake = Math.max(targetShake, 4 * smoothstep(26, 29, T));
    shakeMag += (targetShake - shakeMag) * Math.min(1, dt * 12);

    const shx = Math.sin(gt * 43) * Math.cos(gt * 29) * shakeMag;
    const shy = Math.cos(gt * 51) * Math.sin(gt * 37) * shakeMag;

    /* ---- 更新 ---- */
    updateCity(dt, 1);
    updateParticles(dt, collapse);
    updateRipples(dt, T, SW.ripple * A);
    updateSpiral(dt, SW.hole * A, energy, collapse);
    updateMatrix(dt, SW.matrix * A);

    /* ---- 渲染 ---- */
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.translate(shx, shy);

    if (A > 0.005){
      drawBgGlow(T, A);
      drawRipples(T, SW.ripple * A, collapse);
      drawStars(dt, gt, T, SW.stars * A);
      drawCity(gt, SW.city * A);
      drawMatrix(gt, SW.matrix * A);
      drawDNA(gt, T, SW.dna * A);
      drawECG(gt, T, SW.ecg * A, collapse);
      drawSpiral(T, SW.hole * A);
      drawBlackHole(gt, T, SW.hole * A, energy);
      drawParticles(T, A);
    }

    drawVignette();
    drawCore(gt, A * 0.6 + energy * 0.4);
    drawFlash(flashAge, flashStrength);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    if (hintEl){
      hintEl.style.opacity = held ? '0' : '';
    }

    wasHeld = held;
  }

  /* ================= 交互：只认中心圆 ================= */
  function hitRadius(){
    return Math.max(85, Math.min(W, H) * 0.15);
  }
  function inCircle(x, y){
    const dx = x - cx, dy = y - cy;
    const r = hitRadius();
    return dx * dx + dy * dy <= r * r;
  }

  window.addEventListener('pointerdown', function (e){
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const x = (e.clientX !== undefined) ? e.clientX : e.x;
    const y = (e.clientY !== undefined) ? e.clientY : e.y;
    if (!inCircle(x, y)) return;

    // 松手后再次按下 → 音频从头开始
    startMusic();

    held = true;
    e.preventDefault();
  }, { passive: false });

  function handleRelease(){
    if (held){
      held = false;
      stopMusicSmooth();   // 松手 → 音乐平滑淡出
    }
  }

  window.addEventListener('pointerup',     handleRelease);
  window.addEventListener('pointercancel', handleRelease);
  window.addEventListener('blur',          handleRelease);
  window.addEventListener('contextmenu',   function(e){ e.preventDefault(); });

  document.addEventListener('visibilitychange', function(){
    if (document.hidden){
      held = false;
      stopMusicImmediate();   // 页面隐藏 → 立即停止
    }
    lastTime = performance.now();
  });

  window.addEventListener('keydown', function(e){
    if (e.code === 'Space' || e.code === 'Enter'){
      if (!held){
        startMusic();
        held = true;
      }
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', function(e){
    if (e.code === 'Space' || e.code === 'Enter'){
      handleRelease();
      e.preventDefault();
    }
  });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){
    setTimeout(resize, 130);
  });

  /* ================= 启动 ================= */
  resize();
  lastTime = performance.now();
  requestAnimationFrame(frame);
})();
</script>
</body>

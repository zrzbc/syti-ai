<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>请创建一个专属密码</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fcf7f2;
            background-image: radial-gradient(circle at 20% 30%, rgba(243, 213, 181, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(243, 213, 181, 0.25) 0%, transparent 50%);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }
        .game-master {
            width: 100%;
            max-width: 700px;
            background: #ffffff;
            border-radius: 36px;
            padding: 32px 36px 28px;
            box-shadow: 0 20px 48px rgba(140, 100, 50, 0.12), 0 4px 16px rgba(0,0,0,0.04);
            border: 1px solid rgba(220, 190, 150, 0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
            transform: scale(1.03);
            transform-origin: center center;
        }
        @media (max-width: 600px) {
            .game-master {
                transform: scale(1);
                padding: 20px 16px 18px;
                border-radius: 24px;
                gap: 16px;
            }
        }
        .title-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .title-icon { font-size: 2rem; line-height: 1; }
        .title-text { font-size: 1.4rem; font-weight: 600; color: #4b3621; letter-spacing: -0.3px; }
        .title-hint { font-size: 0.8rem; font-weight: 400; color: #9b8c7c; margin-top: 2px; }
        .timer-box {
            margin-left: auto;
            background: #f9f2e9;
            border-radius: 100px;
            padding: 8px 18px;
            font-size: 0.9rem;
            font-weight: 550;
            color: #7b6e5e;
            font-variant-numeric: tabular-nums;
            font-family: 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
            opacity: 0;
            transition: opacity 0.4s ease;
            white-space: nowrap;
            border: 1px solid #e4d5c2;
        }
        .timer-box.visible { opacity: 1; }
        .input-wrapper { position: relative; }
        .input-field {
            width: 100%;
            height: 58px;
            border: 2px solid #e8d7c0;
            border-radius: 20px;
            padding: 0 20px;
            font-size: 1.3rem;
            font-family: 'JetBrains Mono', 'SF Mono', 'Consolas', 'Fira Code', monospace;
            letter-spacing: 0.06em;
            color: #2e241a;
            background: #fefdfb;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .input-field:focus {
            border-color: #cfb594;
            box-shadow: 0 0 0 6px rgba(207, 181, 148, 0.13);
            background: #ffffff;
        }
        .input-field.win-glow {
            border-color: #27ae60 !important;
            box-shadow: 0 0 0 10px rgba(39, 174, 96, 0.12) !important;
            background: #f6fdf8 !important;
            color: #1a4d2a;
            transition: all 0.5s ease;
        }
        .char-badge {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
            font-weight: 600;
            color: #c4b29a;
            pointer-events: none;
            font-family: 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
            transition: color 0.2s;
        }
        .char-badge.exact { color: #27ae60; }
        .prompt-stage {
            position: relative;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .main-card-container {
            position: relative;
            overflow: hidden;
            border-radius: 18px;
        }
        .card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-radius: 18px;
            background: #fefdfb;
            border: 2px solid #e8d7c0;
            min-height: 60px;
            will-change: transform, opacity;
            position: relative;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }
        .card.active {
            border-color: #d4b896;
            background: #fdf8f3;
            box-shadow: 0 4px 14px rgba(180, 140, 90, 0.08);
        }
        .card.error-flash {
            animation: flashRed 0.55s ease;
        }
        .card.slide-out {
            animation: slideOutRight 0.38s cubic-bezier(0.55, 0, 0.1, 1) forwards;
        }
        .card.bounce-in {
            animation: bounceInUp 0.48s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .card.ghost {
            opacity: 0;
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
        }
        .card-index {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e8d7c0;
            color: #5e4630;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-family: 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
            transition: background 0.2s, color 0.2s;
        }
        .card.active .card-index {
            background: #cfb594;
            color: #ffffff;
            box-shadow: 0 3px 10px rgba(180, 130, 70, 0.3);
        }
        .card-text {
            flex: 1;
            font-size: 0.98rem;
            font-weight: 500;
            color: #3e3024;
            line-height: 1.4;
            letter-spacing: 0.01em;
        }
        .card-icon {
            flex-shrink: 0;
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .card-icon.show { opacity: 1; }
        .card-icon.pass { color: #27ae60; }
        .card-icon.fail { color: #e74c3c; }
        .error-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
        }
        .error-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 16px;
            background: #fff5f4;
            border: 2px solid #e74c3c;
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            will-change: transform, opacity;
        }
        .error-card.slide-out-error {
            animation: slideOutRightError 0.32s cubic-bezier(0.55, 0, 0.1, 1) forwards;
        }
        .error-card .card-index {
            background: #e74c3c;
            color: white;
        }
        .error-card .card-text {
            color: #5b1a1a;
            font-weight: 500;
        }
        @keyframes flashRed {
            0%, 100% { border-color: #e8d7c0; box-shadow: none; background: #fefdfb; }
            15% { border-color: #e74c3c; box-shadow: 0 0 0 6px rgba(231, 76, 60, 0.15); background: #fff5f4; }
            30% { border-color: #e8d7c0; box-shadow: none; background: #fefdfb; }
            45% { border-color: #e74c3c; box-shadow: 0 0 0 6px rgba(231, 76, 60, 0.15); background: #fff5f4; }
            60% { border-color: #e8d7c0; box-shadow: none; background: #fefdfb; }
            75% { border-color: #e74c3c; box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.1); }
        }
        @keyframes slideOutRight {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(130%); opacity: 0; }
        }
        @keyframes bounceInUp {
            0% { transform: translateY(55px); opacity: 0; }
            65% { transform: translateY(-6px); opacity: 1; }
            85% { transform: translateY(2px); }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes popIn {
            0% { transform: translateY(-18px); opacity: 0; }
            60% { transform: translateY(3px); opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideOutRightError {
            0% { transform: translateX(0); opacity: 1; max-height: 70px; margin-bottom: 10px; }
            100% { transform: translateX(140%); opacity: 0; max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; border-width: 0; }
        }
        .emoji-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }
        .rain-drop {
            position: absolute;
            font-size: 2.2rem;
            animation: fall linear forwards;
            pointer-events: none;
            user-select: none;
        }
        @keyframes fall {
            0% { transform: translateY(-120px) rotate(0deg); opacity: 1; }
            70% { opacity: 1; }
            100% { transform: translateY(105vh) rotate(540deg); opacity: 0; }
        }
        .victory-toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            border: 2px solid #27ae60;
            border-radius: 20px;
            padding: 12px 28px;
            z-index: 10000;
            font-weight: 600;
            color: #1a4d2a;
            font-size: 1rem;
            box-shadow: 0 12px 32px rgba(39, 174, 96, 0.18);
            animation: toastPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }
        @keyframes toastPop {
            0% { transform: translateX(-50%) translateY(-36px); opacity: 0; }
            100% { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        .time-highlight {
            font-family: 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
            font-weight: 700;
            color: #27ae60;
            font-size: 1.15rem;
        }
    </style>
</head>
<body>
    <div class="game-master" id="gameMaster">
        <div class="title-area">
            <div>
                <div class="title-text">请创建一个专属密码！</div>
            </div>
            <div class="timer-box" id="timerBox">时间 00:00</div>
        </div>

        <div class="input-wrapper">
            <input type="text" class="input-field" id="passwordInput" placeholder="在此输入..." autocomplete="off" spellcheck="false" maxlength="40">
            <span class="char-badge" id="charBadge">0</span>
        </div>

        <div class="prompt-stage" id="promptStage">
            <div class="main-card-container" id="mainCardContainer">
                <div class="card active bounce-in" id="mainCard">
                    <span class="card-index" id="mainCardIndex">1</span>
                    <span class="card-text" id="mainCardText">该密码需要包含英文字母及数字。</span>
                    <span class="card-icon" id="mainCardIcon"></span>
                </div>
            </div>
            <div class="error-stack" id="errorStack"></div>
        </div>
    </div>

    <div class="emoji-rain" id="emojiRain"></div>

    <script>
        (function() {
            // ---------- DOM 元素 ----------
            const passwordInput = document.getElementById('passwordInput');
            const charBadge = document.getElementById('charBadge');
            const timerBox = document.getElementById('timerBox');
            const mainCard = document.getElementById('mainCard');
            const mainCardIndex = document.getElementById('mainCardIndex');
            const mainCardText = document.getElementById('mainCardText');
            const mainCardIcon = document.getElementById('mainCardIcon');
            const errorStack = document.getElementById('errorStack');
            const emojiRain = document.getElementById('emojiRain');

            // ---------- 条件文本（含简要说明）----------
            const CONDITION_TEXTS = [
                '密码需要包含英文字母及数字。',
                '密码需要包含标点符号。',
                '密码里有且只能有3个奇数。',
                '密码里的所有数字之和等于25。',
                '密码包含5个相同的字母。',
                '密码有且只能存在7个数字。',
                '密码需要包含4个连续递增的大写字母。',
                '密码的长度为18个字符。',
                '密码的第1位和第18位字符是小写字母。',
                '密码的数字从大到小紧挨着排序。',
                '密码里的数字不能被3整除。',
                '密码的第1位和第18位字母可以组成化学元素。',
                '密码需要包含3个及以上的质数。',
                '密码里的其中4个数字能组成24点。',
                '密码里包含一个百分数。'
            ];

            // 双字母化学元素（小写）
            const TWO_LETTER_ELEMENTS = new Set([
                'he','li','be','ne','na','mg','al','si','cl','ar','ca','sc','ti','cr','mn','fe','co','ni','cu','zn',
                'ga','ge','as','se','br','kr','rb','sr','y','zr','nb','mo','tc','ru','rh','pd','ag','cd','in','sn',
                'sb','te','xe','cs','ba','la','ce','pr','nd','pm','sm','eu','gd','tb','dy','ho','er','tm','yb','lu',
                'hf','ta','re','os','ir','pt','au','hg','tl','pb','bi','po','at','rn','fr','ra','ac','th','pa','u',
                'np','pu','am','cm','bk','cf','es','fm','md','no','lr','rf','db','sg','bh','hs','mt','ds','rg','cn',
                'nh','fl','mc','lv','ts','og'
            ]);

            // ---------- 游戏状态 ----------
            let currentIndex = 0;
            let gameWon = false;
            let isAnimating = false;
            let firstInputTime = null;
            let timerInterval = null;
            let errorElementsMap = new Map(); // index -> DOM元素，确保唯一

            // ---------- 辅助函数 ----------
            function getDigits(pwd) {
                return (pwd.match(/\d/g) || []).map(Number);
            }
            function getDigitPositions(pwd) {
                const positions = [];
                for (let i = 0; i < pwd.length; i++) {
                    if (/\d/.test(pwd[i])) positions.push({ index: i, value: Number(pwd[i]) });
                }
                return positions;
            }

            // ---------- 核心检测函数（已修正所有已知bug）----------
            function checkCondition(index, pwd) {
                const digits = getDigits(pwd);
                switch (index) {
                    case 0: // 包含英文字母及数字
                        return /[a-zA-Z]/.test(pwd) && /\d/.test(pwd);
                    case 1: // 包含标点符号（使用Unicode属性，支持中英文标点）
                        return /\p{P}/u.test(pwd);
                    case 2: // 有且只能有3个奇数
                        return digits.filter(d => d % 2 === 1).length === 3;
                    case 3: // 所有数字之和等于25
                        return digits.length > 0 && digits.reduce((a,b) => a + b, 0) === 25;
                    case 4: { // 包含5个重复的字母（不区分大小写）
                        const freq = {};
                        for (const ch of pwd) {
                            if (/[a-zA-Z]/.test(ch)) {
                                const lower = ch.toLowerCase();
                                freq[lower] = (freq[lower] || 0) + 1;
                            }
                        }
                        return Object.values(freq).some(c => c >= 5);
                    }
                    case 5: // 且只能存在7个数字
                        return digits.length === 7;
                    case 6: { // 包含4个连续递增的大写字母
                        for (let i = 0; i <= pwd.length - 4; i++) {
                            const sub = pwd.substring(i, i + 4);
                            if (/^[A-Z]{4}$/.test(sub)) {
                                const c0 = sub.charCodeAt(0), c1 = sub.charCodeAt(1),
                                      c2 = sub.charCodeAt(2), c3 = sub.charCodeAt(3);
                                if (c1 === c0 + 1 && c2 === c1 + 1 && c3 === c2 + 1) return true;
                            }
                        }
                        return false;
                    }
                    case 7: // 长度为18个字符
                        return pwd.length === 18;
                    case 8: // 第1位和第18位是小写字母
                        if (pwd.length < 18) return false;
                        return /^[a-z]$/.test(pwd[0]) && /^[a-z]$/.test(pwd[17]);
                    case 9: { // 数字从大到小挨着排序（连续且非递增）
                        const pos = getDigitPositions(pwd);
                        if (pos.length < 2) return false;
                        for (let i = 1; i < pos.length; i++) {
                            if (pos[i].index !== pos[i-1].index + 1) return false;
                            if (pos[i].value > pos[i-1].value) return false;
                        }
                        return true;
                    }
                    case 10: // 数字不能被3整除（注意0能被3整除）
                        return digits.length > 0 && digits.every(d => d % 3 !== 0);
                    case 11: { // 第1位与第18位字母组合是化学元素
                        if (pwd.length < 18) return false;
                        const first = pwd[0], last = pwd[17];
                        if (!/^[a-z]$/.test(first) || !/^[a-z]$/.test(last)) return false;
                        return TWO_LETTER_ELEMENTS.has((first + last).toLowerCase());
                    }
                    case 12: { // 包含3个质数（2,5,7）
                        const primeDigits = digits.filter(d => d === 2 || d === 5 || d === 7);
                        return primeDigits.length >= 3;
                    }
                    case 13: { // 其中4个数字能组成24点
                        if (digits.length < 4) return false;
                        const n = digits.length;
                        for (let a = 0; a < n; a++)
                            for (let b = a+1; b < n; b++)
                                for (let c = b+1; c < n; c++)
                                    for (let d = c+1; d < n; d++) {
                                        if (canMake24([digits[a], digits[b], digits[c], digits[d]])) return true;
                                    }
                        return false;
                    }
                    case 14: // 包含一个百分数
                        return /\d%/.test(pwd);
                    default: return false;
                }
            }

            // 24点求解器
            function canMake24(nums) {
                const eps = 1e-9;
                function solve(arr) {
                    if (arr.length === 1) return Math.abs(arr[0] - 24) < eps;
                    for (let i = 0; i < arr.length; i++) {
                        for (let j = i + 1; j < arr.length; j++) {
                            const a = arr[i], b = arr[j];
                            const rest = arr.filter((_, idx) => idx !== i && idx !== j);
                            const vals = [a + b, a - b, b - a, a * b];
                            if (Math.abs(b) > eps) vals.push(a / b);
                            if (Math.abs(a) > eps) vals.push(b / a);
                            for (const v of vals) {
                                if (solve([...rest, v])) return true;
                            }
                        }
                    }
                    return false;
                }
                return solve(nums);
            }

            // ---------- 主卡片UI更新 ----------
            function updateMainCard(index, flash = false) {
                mainCardIndex.textContent = index + 1;
                mainCardText.textContent = CONDITION_TEXTS[index];
                mainCardIcon.textContent = '';
                mainCardIcon.classList.remove('show', 'pass', 'fail');
                mainCard.classList.remove('error-flash');
                if (flash) {
                    mainCardIcon.textContent = '✗';
                    mainCardIcon.classList.add('show', 'fail');
                    void mainCard.offsetWidth;
                    mainCard.classList.add('error-flash');
                }
                mainCard.classList.add('active');
            }

            function animateMainOut(callback) {
                if (isAnimating) return;
                isAnimating = true;
                mainCard.classList.add('slide-out');
                mainCard.addEventListener('animationend', function handler() {
                    mainCard.removeEventListener('animationend', handler);
                    mainCard.classList.remove('slide-out');
                    mainCard.classList.add('ghost');
                    callback();
                }, { once: true });
            }

            function animateMainIn(index) {
                mainCard.classList.remove('ghost');
                updateMainCard(index, false);
                mainCard.classList.remove('bounce-in');
                void mainCard.offsetWidth;
                mainCard.classList.add('bounce-in');
                mainCard.addEventListener('animationend', function handler() {
                    mainCard.removeEventListener('animationend', handler);
                    mainCard.classList.remove('bounce-in');
                    isAnimating = false;
                    scheduleDetection();
                }, { once: true });
            }

            // ---------- 错误提示框管理（严格去重，每个索引只一个框）----------
            function updateErrorPrompts(failedIndices) {
                const targetSet = new Set(failedIndices);
                // 1. 移除不再需要的框（包括动画残留）
                const allErrorCards = [...errorStack.querySelectorAll('.error-card')];
                for (const card of allErrorCards) {
                    const idx = parseInt(card.dataset.index);
                    if (isNaN(idx) || !targetSet.has(idx)) {
                        card.classList.add('slide-out-error');
                        card.addEventListener('animationend', function handler() {
                            card.removeEventListener('animationend', handler);
                            if (card.parentNode) card.parentNode.removeChild(card);
                        }, { once: true });
                    }
                }
                // 同步清理 map
                for (const [idx, el] of errorElementsMap.entries()) {
                    if (!targetSet.has(idx)) {
                        if (el.parentNode && !el.classList.contains('slide-out-error')) {
                            el.classList.add('slide-out-error');
                            el.addEventListener('animationend', function handler() {
                                el.removeEventListener('animationend', handler);
                                if (el.parentNode) el.parentNode.removeChild(el);
                            }, { once: true });
                        }
                        errorElementsMap.delete(idx);
                    }
                }
                // 2. 添加缺失的框（确保唯一）
                for (const idx of targetSet) {
                    if (errorElementsMap.has(idx)) continue;
                    // 强制移除任何同索引的残留元素
                    const oldCard = errorStack.querySelector(`.error-card[data-index="${idx}"]`);
                    if (oldCard) {
                        oldCard.classList.add('slide-out-error');
                        oldCard.addEventListener('animationend', function handler() {
                            oldCard.removeEventListener('animationend', handler);
                            if (oldCard.parentNode) oldCard.parentNode.removeChild(oldCard);
                        }, { once: true });
                    }
                    const errorCard = document.createElement('div');
                    errorCard.className = 'error-card';
                    errorCard.dataset.index = idx;
                    errorCard.innerHTML = `
                        <span class="card-index">${idx + 1}</span>
                        <span class="card-text">${CONDITION_TEXTS[idx]}</span>
                        <span class="card-icon show" style="color:#e74c3c;">✗</span>
                    `;
                    // 按索引顺序插入
                    let inserted = false;
                    const children = [...errorStack.children];
                    for (const child of children) {
                        const childIdx = parseInt(child.dataset.index);
                        if (!isNaN(childIdx) && childIdx > idx) {
                            errorStack.insertBefore(errorCard, child);
                            inserted = true;
                            break;
                        }
                    }
                    if (!inserted) errorStack.appendChild(errorCard);
                    errorElementsMap.set(idx, errorCard);
                    void errorCard.offsetWidth;
                    errorCard.classList.add('popIn');
                }
                // 3. 最终确保DOM顺序绝对正确
                const sortedIndices = [...errorElementsMap.keys()].sort((a,b) => a - b);
                for (let i = 0; i < sortedIndices.length; i++) {
                    const el = errorElementsMap.get(sortedIndices[i]);
                    if (el && el !== errorStack.children[i]) {
                        errorStack.insertBefore(el, errorStack.children[i] || null);
                    }
                }
            }

            function getFailedPrevious(pwd) {
                const failed = [];
                for (let i = 0; i < currentIndex; i++) {
                    if (!checkCondition(i, pwd)) failed.push(i);
                }
                return failed;
            }

            // ---------- 检测调度 ----------
            let detectTimer;
            function scheduleDetection() {
                if (detectTimer) clearTimeout(detectTimer);
                detectTimer = setTimeout(performDetection, 40);
            }

            function performDetection() {
                if (gameWon) return;
                const pwd = passwordInput.value;
                charBadge.textContent = pwd.length;
                charBadge.classList.toggle('exact', pwd.length === 18);

                const currentOk = checkCondition(currentIndex, pwd);
                const failedPrev = getFailedPrevious(pwd);
                updateErrorPrompts(failedPrev);

                // 主卡片图标与闪烁
                if (currentOk && failedPrev.length === 0) {
                    mainCardIcon.textContent = '✓';
                    mainCardIcon.classList.add('show', 'pass');
                    mainCardIcon.classList.remove('fail');
                    mainCard.classList.remove('error-flash');
                } else if (currentOk && failedPrev.length > 0) {
                    mainCardIcon.textContent = '✓';
                    mainCardIcon.classList.add('show', 'pass');
                    mainCardIcon.classList.remove('fail');
                    mainCard.classList.remove('error-flash');
                } else {
                    if (!mainCard.classList.contains('error-flash')) {
                        mainCardIcon.textContent = '✗';
                        mainCardIcon.classList.add('show', 'fail');
                        mainCardIcon.classList.remove('pass');
                        void mainCard.offsetWidth;
                        mainCard.classList.add('error-flash');
                    }
                }

                // 推进或胜利
                if (currentOk && failedPrev.length === 0 && !isAnimating && !gameWon) {
                    if (currentIndex === 14) {
                        triggerVictory();
                    } else {
                        animateMainOut(() => {
                            currentIndex++;
                            // 新条件开始，立即刷新前序失败框
                            const newFailed = getFailedPrevious(pwd);
                            updateErrorPrompts(newFailed);
                            animateMainIn(currentIndex);
                        });
                    }
                }
            }

            // ---------- 胜利处理 ----------
            function triggerVictory() {
                if (gameWon) return;
                gameWon = true;
                isAnimating = true;
                if (timerInterval) clearInterval(timerInterval);
                const elapsed = Math.floor((Date.now() - (firstInputTime || Date.now())) / 1000);
                const min = String(Math.floor(elapsed / 60)).padStart(2, '0');
                const sec = String(elapsed % 60).padStart(2, '0');
                const timeStr = `${min}:${sec}`;

                passwordInput.classList.add('win-glow');
                passwordInput.readOnly = true;

                mainCard.style.borderColor = '#27ae60';
                mainCard.style.background = '#e9f7ef';
                mainCard.style.boxShadow = '0 4px 20px rgba(39, 174, 96, 0.15)';
                mainCardIndex.style.background = '#27ae60';
                mainCardIndex.style.color = 'white';
                mainCardIcon.textContent = '🎉';
                mainCardIcon.classList.add('show', 'pass');
                mainCardIcon.classList.remove('fail');
                mainCardText.textContent = '🎉 完美！所有条件已达成。';
                mainCard.classList.remove('error-flash', 'active');

                errorStack.innerHTML = '';
                errorElementsMap.clear();

                timerBox.textContent = `⏱ ${timeStr}`;
                timerBox.classList.add('visible');
                timerBox.style.color = '#27ae60';
                timerBox.style.background = '#e9f7ef';
                timerBox.style.borderColor = '#27ae60';

                const toast = document.createElement('div');
                toast.className = 'victory-toast';
                toast.innerHTML = `恭喜通关！ 用时 <span class="time-highlight">${timeStr}</span>`;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 5000);

                spawnEmojiRain();
                isAnimating = false;
            }

            function spawnEmojiRain() {
                const emojis = ['🎉','🎊','✨','🌟','💫','🥳','🎯','💎','🔥','🏆','👑','⭐','🌈','💪','🎪','🍾','🎆','🎇','💖','🦄'];
                emojiRain.innerHTML = '';
                for (let i = 0; i < 50; i++) {
                    const drop = document.createElement('span');
                    drop.className = 'rain-drop';
                    drop.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    drop.style.left = Math.random() * 100 + '%';
                    drop.style.animationDuration = (Math.random() * 2.5 + 2.2) + 's';
                    drop.style.animationDelay = Math.random() * 1.6 + 's';
                    drop.style.fontSize = (Math.random() * 2 + 1.5) + 'rem';
                    emojiRain.appendChild(drop);
                    const delay = parseFloat(drop.style.animationDelay) + parseFloat(drop.style.animationDuration);
                    setTimeout(() => drop.remove(), delay * 1000 + 500);
                }
            }

            // ---------- 事件监听 ----------
            passwordInput.addEventListener('input', () => {
                if (gameWon) return;
                if (!firstInputTime) {
                    firstInputTime = Date.now();
                    timerBox.classList.add('visible');
                }
                scheduleDetection();
            });

            timerInterval = setInterval(() => {
                if (gameWon) return;
                const ref = firstInputTime || Date.now();
                const diff = Math.floor((Date.now() - ref) / 1000);
                const min = String(Math.floor(diff / 60)).padStart(2, '0');
                const sec = String(diff % 60).padStart(2, '0');
                timerBox.textContent = `⏱ ${min}:${sec}`;
                if (firstInputTime || diff > 0) timerBox.classList.add('visible');
            }, 400);

            // ---------- 初始化 ----------
            function resetGame() {
                currentIndex = 0;
                gameWon = false;
                isAnimating = false;
                firstInputTime = null;
                errorElementsMap.clear();
                errorStack.innerHTML = '';
                passwordInput.value = '';
                passwordInput.classList.remove('win-glow');
                passwordInput.readOnly = false;
                charBadge.textContent = '0';
                charBadge.classList.remove('exact');
                timerBox.textContent = '⏱ 00:00';
                timerBox.classList.remove('visible');
                timerBox.style.color = '';
                timerBox.style.background = '';
                timerBox.style.borderColor = '';
                mainCard.style.borderColor = '';
                mainCard.style.background = '';
                mainCard.style.boxShadow = '';
                mainCardIndex.style.background = '';
                mainCardIndex.style.color = '';
                mainCardIcon.textContent = '';
                mainCardIcon.classList.remove('show', 'pass', 'fail');
                mainCard.classList.remove('error-flash', 'ghost', 'slide-out', 'bounce-in');
                updateMainCard(0, false);
                mainCard.classList.add('active');
                passwordInput.focus();
            }

            resetGame();
            setTimeout(() => passwordInput.focus(), 100);
            console.log('密码挑战已启动 — 示例：hABCDhhhh7544221%e （标点支持中英文）');
        })();
    </script>

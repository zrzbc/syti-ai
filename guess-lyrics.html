<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猜歌词 - 今日挑战</title>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
<style>
  :root{
    --blue:#4f7cff; --purple:#8a5cf6; --ink:#172033; --muted:#6f7890;
    --line:#e8ebf5; --bg:#f7f9ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  
  a { text-decoration: none !important; color: inherit; }
  
  body{
    font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background: radial-gradient(circle at 10% 5%,rgba(79,124,255,.14),transparent 28%),
                radial-gradient(circle at 90% 10%,rgba(138,92,246,.13),transparent 30%),
                var(--bg);
    line-height:1.7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 100px 20px 40px;
  }
  
  /* 核心布局：左右分栏 */
  .game-container {
    width: min(1100px, 100%);
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }
  
  /* 左侧/右侧 通用卡片样式 */
  .panel {
    background: rgba(255,255,255,.78);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.95);
    box-shadow: 0 18px 60px rgba(67,72,120,.10);
    border-radius: 20px;
    padding: 28px;
    flex: 1; /* 左右各占 1/2 */
  }
  
  /* ★ 右侧操作区特殊处理：固定在视口中，不随左侧长文滚动 */
  .right-panel {
    position: sticky;
    top: 100px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-height: 300px;
  }

  .header { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px; }
  .title { font-size:22px; font-weight:800; letter-spacing:-.5px; }
  
  /* 歌词面板：彻底放开高度限制，自然撑开 */
  .lyrics-box {
    background: #fff; border: 1px solid var(--line); border-radius: 16px;
    padding: 24px; font-size: 18px; line-height: 1.8; 
    user-select: none; word-break: break-word;
  }
  
  /* 核心排版：统一每个字和方块的格子大小 */
  .char-cell {
    display: inline-block;
    width: 1.5em;
    height: 1.5em;
    line-height: 1.5em;
    text-align: center;
    vertical-align: middle;
    margin: 4px 6px;
    border-radius: 4px;
    font-size: 18px;
  }
  
  /* 未猜出的黑块 */
  .char-masked {
    background-color: var(--ink);
  }
  
  /* 猜出的字 */
  .char-revealed {
    color: var(--blue); 
    font-weight: bold;
    animation: pop 0.3s ease-out;
  }
  @keyframes pop { 0%{transform:scale(.8);opacity:.5} 100%{transform:scale(1);opacity:1} }

  /* 标点符号 */
  .char-punctuation {
    display: inline-block;
    width: auto;
    min-width: 1em;
    text-align: center;
    vertical-align: middle;
    margin: 4px 2px;
    font-size: 18px;
  }

  /* 输入区 */
  .input-area { display: flex; flex-direction: column; gap: 12px; }
  .input-row { display: flex; gap: 10px; }
  .input-row input {
    flex: 1; padding: 14px 18px; border: 2px solid var(--line); border-radius: 14px;
    font-size: 16px; outline: none; font-family: inherit; transition: .2s;
  }
  .input-row input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(79,124,255,.1); }
  .input-row button {
    padding: 0 24px; border: none; border-radius: 14px; background: linear-gradient(110deg,var(--blue),var(--purple));
    color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: .2s;
  }
  .input-row button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(91,100,230,.3); }
  
  /* 错误提示区 */
  .error-area { display: flex; flex-wrap: wrap; gap: 8px; min-height: 40px; }
  .error-chip {
    background: #fff0f3; color: #ef4444; border: 1px solid #f0d0d5;
    padding: 6px 14px; border-radius: 8px; font-size: 14px; font-weight: 600;
    animation: shake 0.4s ease-out;
  }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
  
  /* 成功提示 */
  .win-msg { display: none; text-align: center; font-weight: bold; font-size: 18px; padding: 20px; border-radius: 12px; border: 1px solid; }
  .win-msg.success { color: #22c55e; background: #f0fdf4; border-color: #bbf7d0; }

  /* 手机端适配：自动折叠为上下布局 */
  @media(max-width: 768px) {
    .game-container {
      flex-direction: column;
      align-items: stretch;
    }
    .right-panel {
      position: static; /* 取消固定定位 */
    }
    body {
      padding: 100px 16px 30px;
    }
  }
</style>
</head>
<body>

<div class="game-container">
  
  <!-- 左侧：歌词区 -->
  <div class="panel left-panel">
    <div class="header">
      <div class="title">猜歌词 - 今日挑战</div>
    </div>
    <div class="lyrics-box" id="lyricsBox">加载中...</div>
  </div>
  
  <!-- 右侧：操作区 -->
  <div class="panel right-panel">
    <div class="title" style="margin-bottom: 20px;">答题区</div>
    
    <div class="win-msg" id="winMsg"></div>

    <div class="input-area" id="inputArea">
      <div class="input-row">
        <input type="text" id="guessInput" placeholder="输入 关键字 或 歌名 ..." autocomplete="off" maxlength="20">
        <button id="submitBtn">确认</button>
      </div>
      <div style="font-size: 13px; color: var(--muted); margin-top: 4px;"></div>
      <div class="error-area" id="errorArea"></div>
    </div>
  </div>
  
</div>

<script src="common.js?v=5"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const lyricsBox = document.getElementById('lyricsBox');
  const input = document.getElementById('guessInput');
  const submitBtn = document.getElementById('submitBtn');
  const errorArea = document.getElementById('errorArea');
  const winMsg = document.getElementById('winMsg');

  let gameData = null;
  let guessedChars = new Set();
  let isWin = false;

  try {
    const res = await fetch('/api/game/get-lyrics');
    const json = await res.json();
    if (!json.success) {
      lyricsBox.textContent = '今日暂无题目，等待管理员更新~';
      document.getElementById('inputArea').style.display = 'none';
      return;
    }
    gameData = json.data;
    renderLyrics();
  } catch (e) {
    lyricsBox.textContent = '加载失败，请刷新重试';
  }

  function renderLyrics() {
    lyricsBox.innerHTML = '';
    const masked = gameData.masked_lyrics;
    const original = gameData.original_lyrics;
    
    for (let i = 0; i < masked.length; i++) {
      const mChar = masked[i];
      const oChar = original[i];
      
      if (mChar === '\n') {
        lyricsBox.appendChild(document.createElement('br'));
        continue;
      }
      
      const span = document.createElement('span');
      
      if (mChar === '■') { 
        span.className = 'char-cell';
        if (guessedChars.has(oChar)) {
          span.textContent = oChar;
          span.classList.add('char-revealed');
        } else {
          span.classList.add('char-masked');
          span.dataset.char = oChar;
        }
      } else {
        if (mChar === ' ') {
          span.className = 'char-cell';
        } else {
          span.className = 'char-punctuation';
          span.textContent = mChar;
        }
      }
      lyricsBox.appendChild(span);
    }
  }

  function submit() {
    if (isWin || !gameData) return;
    const val = input.value.trim();
    if (!val) return;
    
    if (val.toLowerCase() === gameData.song_name.toLowerCase()) {
      handleWin();
      return;
    }

    let hit = false;
    const isSingleChar = val.length === 1;
    
    if (isSingleChar) {
      guessedChars.add(val);
      hit = gameData.original_lyrics.includes(val);
      if (hit) renderLyrics();
    } else {
      const chars = val.split('');
      let anyHit = false;
      chars.forEach(c => {
        if (gameData.original_lyrics.includes(c)) {
          guessedChars.add(c);
          anyHit = true;
        }
      });
      if (anyHit) {
        hit = true;
        renderLyrics();
      }
    }

    if (!hit) {
      const chip = document.createElement('div');
      chip.className = 'error-chip';
      chip.textContent = val;
      errorArea.appendChild(chip);
    }
    
    input.value = '';
    input.focus();
  }

  async function handleWin() {
    isWin = true;
    winMsg.className = 'win-msg success';
    winMsg.textContent = '挑战成功！答案正是《' + gameData.song_name + '》';
    winMsg.style.display = 'block';
    document.getElementById('inputArea').style.display = 'none';
    
    const spans = lyricsBox.querySelectorAll('.char-masked');
    spans.forEach(span => {
      span.textContent = span.dataset.char;
      span.classList.remove('char-masked');
      span.classList.add('char-revealed');
    });

    const user = window.getLocalUser ? window.getLocalUser() : null;
    if (user && user.email) {
      try {
        const res = await fetch('/api/game/complete-lyrics', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: user.email })
        });
        const data = await res.json();
        if (data.success) {
          if (data.rewarded) {
            winMsg.innerHTML = `挑战成功！答案正是《${gameData.song_name}》<br><span style="font-size:15px;color:#ea580c;">经验 +80！</span>`;
            user.exp = data.exp;
            localStorage.setItem('user', JSON.stringify(user));
            if (window.renderGlobalUI) window.renderGlobalUI();
          } else {
            winMsg.innerHTML = `挑战成功！答案正是《${gameData.song_name}》<br><span style="font-size:14px;color:#6f7890;">（今日奖励已领过）</span>`;
          }
        }
      } catch (e) { console.error('发放奖励失败'); }
    } else {
      winMsg.innerHTML = `挑战成功！答案正是《${gameData.song_name}》<br><span style="font-size:14px;color:#6f7890;">（登录后可获得经验奖励）</span>`;
    }
  }

  submitBtn.addEventListener('click', submit);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) {
      submit();
    }
  });
});
</script>
</body>
</html>
